#
# daos-operator Helm values. The chart installs the CRDs (crds/), the operator
# Deployment with its RBAC, the ClusterRole the host-preparation DaemonSet
# binds to, and optionally the DAOS Grafana dashboard ConfigMap and one
# DaosSystem. Everything else (hostprep DaemonSet, server StatefulSets,
# metrics Service/ServiceMonitor, dmg Jobs) is created by the operator.

image:
  repository: ghcr.io/gluesys/daos-operator
  tag: ""            # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []   # also given to the DaosSystem's pods unless system.spec.imagePullSecrets is set

replicaCount: 1
leaderElect: true
# --metrics-bind-address for the operator's own controller-runtime metrics ("0" = off)
metricsBindAddress: "0"
# Managed Service for the operator endpoint. HTTPS + Kubernetes auth by default.
metrics:
  enabled: false
  port: 8443
  secure: true
logLevel: info

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

serviceAccount:
  create: true
  name: ""           # defaults to the release fullname
  annotations: {}

rbac:
  create: true

# ClusterRole "daos-hostprep" that the operator binds to the per-system hostprep ServiceAccount.
hostprep:
  clusterRole: daos-hostprep
  # image the operator uses when DaosSystem.spec.images.hostPrep is empty ("" = daos-hostprep
  # next to image.repository with the operator's tag, e.g. ghcr.io/gluesys/daos-hostprep:<appVersion>)
  defaultImage: ""

grafana:
  dashboard:
    # ConfigMap with the upstream DAOS Grafana dashboard, labelled for the grafana sidecar
    enabled: false
    namespace: ""    # defaults to the release namespace
    label: grafana_dashboard
    labelValue: "1"

# Create one DaosSystem with the release. spec is passed through as-is (see
# api/v1alpha1 for the fields); the operator fills status.
system:
  create: false
  name: daos
  spec:
    version: "2.8.0"
    namespace: daos-system
    images:
      server: ghcr.io/gluesys/daos-server:2.8.0-20261124-g47deeeda
      agent: ghcr.io/gluesys/daos-agent:2.8.0-20261124-g47deeeda
      admin: ghcr.io/gluesys/daos-admin:2.8.0-20261124-g47deeeda
      client: ghcr.io/gluesys/daos-client:2.8.0-20261124-g47deeeda
    placement: dedicated
    # Storage nodes (Jobs only, for an external system). Unset means
    # {daos.gluesys.com/role: storage}; a selector you set replaces that default instead of
    # being merged with it, so a selector by hostname needs no role label. `{}` selects
    # every node (what `daos.gluesys.com/role: null` did before). Upgrading from 0.2.1: a
    # values file that set `nodeSelector: null` to drop the default now gets the default
    # back (unset and null look the same after the merge); write `{}` instead.
    nodeSelector: null
    msReplicas: 1
    provider: "ofi+verbs;ofi_rxm"
    nrHugepages: 8192
    allowInsecure: true
    engines:
      - targets: 8
        helpers: 2
        scmSizeGiB: 32
    hostPrep:
      enabled: true
      bindNvme: false
      disableTHP: false   # true: hostprep sets transparent_hugepage=never (daos_server refuses THP, code 623)

# exastor/daos-csi: CSI driver (controller Deployment + node DaemonSet with a
# daos_agent sidecar). One driver per DaosSystem: csi.system names the system
# whose <system>-agent ConfigMap (and <system>-certs when tls) the node plugin uses.
# The driver runs in the release namespace and the operator writes those into the
# system's namespace, so install the release into system.spec.namespace (the chart
# refuses to render otherwise when it creates the system).
csi:
  enabled: false
  system: ""              # defaults to system.name
  driverName: daos.csi.gluesys.com
  image:
    repository: ghcr.io/gluesys/daos-csi
    tag: ""               # defaults to .Chart.appVersion
    pullPolicy: IfNotPresent
  # Provisioner operation duration/errors; not the DAOS data path.
  metrics:
    enabled: false
    port: 8080
  agentImage: ""          # defaults to system.spec.images.agent
  tls: false              # mount <system>-certs (agent set for the sidecar, admin set for the daos client)
  sidecars:
    provisioner: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
    registrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
    snapshotter: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
    resizer: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
  kubeletDir: /var/lib/kubelet
  nodeSelector: {}        # nodes that may mount DAOS PVs (default: all)
  tolerations:
    - operator: Exists
  # dfuse --multi-user on the node plugin: each pod's own uid/gid on the files it creates, and
  # access for pods that do not run as root. Needed for StorageClass rootUID/rootGID (a volume
  # root owned by an account UID) and by any pod that runs as an account UID.
  multiUser: false
  # extra dfuse flags for every volume on the node plugin (daos-csi --dfuse-args), e.g. [--disable-caching]
  dfuseArgs: []
  # Where dfuse runs (daos-csi ADR-csi-002).
  #   process: inside the node plugin. A plugin restart or upgrade cuts the DAOS volumes of the
  #            pods running on that node until those pods are recreated.
  #   pod:     one mount pod (daos-mnt-*) per volume and node in the release namespace. A plugin
  #            restart or upgrade leaves running pods and their open files alone. Needs the node
  #            agent: system.spec.clientAgent enabled on every node the plugin runs on
  #            (csi.nodeSelector). Replacing the mount pods themselves (a new client image)
  #            still means draining the node.
  # Switching between the two cuts the volumes on each node once: drain first.
  # pod also needs a daos-csi image with --mount-mode (daos-csi !10 or later): until the appVersion
  # default has it, set csi.image.tag; the chart refuses pod mode otherwise.
  mountMode: process
  mountPod:
    image: ""                 # defaults to system.spec.images.client
    # node agent socket dir. Default: system.spec.clientAgent.hostSocketDir when csi.system is
    # this release's system, else /var/run/daos-operator/agent/<csi.system> (another DaosSystem
    # with a custom hostSocketDir: set it here)
    agentSocketHostPath: ""
    # memory request = limit; empty = 256Mi plus 40Mi for each --eq-count above 1 in dfuseArgs
    memory: ""
    priorityClassName: system-node-critical
  # node plugin DaemonSet update strategy. OnDelete lets the operator of the cluster choose when
  # each node's plugin restarts: with mountMode process a restart cuts the DAOS volumes of the
  # pods running on that node (their mounts do not come back until the pods are recreated), so
  # drain those pods, then delete the plugin pod. With mountMode pod a restart does not touch the
  # mounts. The default restarts one node at a time as soon as the DaemonSet changes.
  # With type: OnDelete, rollingUpdate is ignored.
  nodeUpdateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  # where the controller (provisioner) Deployment may run; empty = anywhere
  controllerNodeSelector: {}
  controllerTolerations: []
  controllerAffinity: {}
  controllerResources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  nodeResources:
    requests: {cpu: 50m, memory: 128Mi}
  # CSI snapshots (VolumeSnapshot). Each snapshot is a DaosContainerSnapshot taken by the
  # operator. A PVC restored from one (dataSource: VolumeSnapshot) with ReadOnlyMany mounts
  # the snapshot itself; any other access mode gets a new container that a restore Job
  # fills from the snapshot (DaosContainer spec.restoreFrom, POSIX containers only).
  # DAOS 2.8 cannot roll a container back in place. Needs the VolumeSnapshot CRDs and
  # snapshot-controller (kubernetes-csi/external-snapshotter), installed once per cluster,
  # and a daos-csi image with snapshot support.
  snapshots:
    enabled: false
    volumeSnapshotClass:
      create: true
      name: daos-snapshot
      default: false
      # Delete destroys the DAOS snapshot with the VolumeSnapshot; Retain keeps it (and its space)
      deletionPolicy: Delete
  # PVC expansion: a csi-resizer sidecar and allowVolumeExpansion on the StorageClasses.
  # Growing a PVC moves its DaosContainer's spec.spaceLimit, which is a container quota
  # in the extended edition of DAOS; on upstream DAOS it only records the size (capacity
  # is per pool). Needs a daos-csi with EXPAND_VOLUME.
  expansion:
    enabled: false
  # StorageClasses to create, one per DaosPool
  storageClasses: []
  #  - name: daos-kv
  #    reclaimPolicy: Delete
  #    parameters: {pool: kv, oclass: RP_2GX, dirOclass: RP_2G1, chunkSize: "4194304", csum: crc32}
  #    # spaceLimit: "false" stops daos-csi from capping each container at its PVC size
  #    # (spec.spaceLimit; enforced by the extended edition of DAOS only)
  #    # rootUID/rootGID (numeric) and rootMode (octal) set the owner of each new volume's root;
  #    # they need multiUser. rootOwnerFromPVC: "true" lets the PVC annotations
  #    # csi.daos.gluesys.com/root-uid, root-gid and root-mode override them (daos-csi !7 or later).

# Interception library injection (doc/plans/2026-11-19-client-interception.md). A mutating
# webhook preloads libioil or libpil4dfs into pods that mount a csi DAOS volume and ask for it
# with the pod annotation daos.gluesys.com/interception: ioil | pil4dfs | pil4dfs-compat | off (or
# the same label on their namespace as a default), so their I/O bypasses dfuse. Client images
# without /opt/daos-il/PATCHES (before daos-images !12) carry an unpatched pil4dfs that breaks shell
# redirections and makes files created after fork() share one object: use pil4dfs-compat (slower
# open/create) or ioil with those. User guide: doc/interception.md. Only pods that can be DAOS
# clients themselves get it: the agent's network side (hostNetwork for RDMA) and, for RDMA, a
# device (privileged, a /dev/infiniband hostPath, or a resource in rdmaResources). Two init
# containers copy the bundle from the daos-client image and test-load it in the application's
# own image; an image that cannot load it (glibc < 2.34, musl) runs on dfuse as before. The
# operator keeps the webhook's certificate itself (no cert-manager). Needs csi.enabled and a
# daos-client image with /opt/daos-il (daos-images !11 or later).
interception:
  enabled: false
  # IBV_DRIVERS for injected containers: bundled rdma-core providers without the -rdmav<N>.so suffix
  ibvDrivers: /opt/daos-il/lib/libibverbs/libmlx5
  # extended resources that give a container an RDMA device (a trailing / matches a prefix)
  rdmaResources: []
  #  - rdma/
  #  - nvidia.com/hostdev
  # The cluster's default Pod Security enforce level (privileged | baseline | restricted), used for
  # namespaces without a pod-security.kubernetes.io/enforce label. Empty = unknown: then the agent
  # socket hostPath is only added to pods that already pass as privileged (hostNetwork, hostPath,
  # privileged), and other pods in unlabelled namespaces are skipped.
  defaultPodSecurity: ""
  # Namespaces the webhook never sees (the release namespace and kube-system are always excluded)
  excludeNamespaces: []
  timeoutSeconds: 5

# DaosPools to create, each optionally with the StorageClass that provisions into it.
# DAOS enforces capacity per pool, not per container: a PVC's requested size is not
# a limit, and every PVC in a pool shares the pool's size. To give teams or uses their
# own capacity, give each its own pool and StorageClass here. When a pool passes its
# spaceWarningPercent the operator sets SpaceLow on the DaosPool and also records a
# PoolSpaceLow Event on each bound PVC in it, so namespace users see it too.
# Pools are kept on helm uninstall (resource-policy: keep); destroying one needs the
# daos.gluesys.com/destroy-approved annotation, as for any DaosPool.
pools: []
#  - name: train                # DaosPool name, also the StorageClass "pool" parameter
#    size: 1Ti                  # required; DAOS 2.8 cannot shrink a pool
#    systemRef: ""              # defaults to system.name
#    spec:                      # any other DaosPool spec field
#      redundancyFactor: 1
#      spaceWarningPercent: 85
#    storageClass:              # omit (or null) for the pool only; {} for all defaults; needs csi.enabled
#      name: daos-train         # defaults to daos-<pool name>
#      reclaimPolicy: Delete
#      parameters: {oclass: RP_2GX, dirOclass: RP_2G1}   # "pool" is always this entry

# vLLM serving with LMCache writing its KV cache to a DAOS container.
# This is a reference workload for PoCs, demos and tests -- not part of the storage
# layer and not a way to run inference in production. It is here so a GPU cluster
# can be brought up with one release. Production serving (KServe, llm-d, Dynamo, ...)
# follows the integration contract in doc/serving-integration.md; verified
# combinations are in doc/compatibility.md. See also doc/deploy-gpu-k8s.md.
#
# The pod runs with hostNetwork because a DAOS client must be reachable at the
# address it advertises; a pod-network client behind the CNI's masquerade is
# not (that is also why spec.clientAgent must be enabled on the GPU nodes).
# rdma: true is needed when DAOS runs on an RDMA provider (ofi+verbs and the
# like): without /dev/infiniband the client pod cannot initialise the libfabric
# verbs provider.
#
# On a cluster with an RDMA device plugin, prefer rdmaResource over rdma. The
# plugin injects only the verbs devices the pod asks for, which drops both the
# /dev/infiniband hostPath and privileged and leaves IPC_LOCK, at the same
# speed -- measured on 400G RoCE, 64 MiB round trip: 2777 MB/s write, 12162 MB/s
# read. If both are set, rdmaResource wins.
#   rdmaResource: rdma/rdma_shared_device_a   # the name the NVIDIA Network Operator advertises
#   rdmaResourceCount: 1
#
# The vllm-lmcache-daos image in the example below lives in our internal
# registry only -- at 10 GB we do not mirror it publicly. The build recipe is
# public, so build your own: images/vllm-lmcache-daos/ in
# github.com/gluesys/daos-images.
vllm:
  services: []
  #  - name: vllm-daos
  #    image: <your-registry>/vllm-lmcache-daos:0.30.0-0.5.5   # internal: registry.gitlab.gluesys.com/exastor/daos-images/vllm-lmcache-daos:0.30.0-0.5.5-20261028
  #    # KV cache target: an existing DaosPool and DaosContainer (POSIX, chunk 4 MiB)
  #    poolRef: podpool
  #    containerRef: kvlmc
  #    systemName: daos_k8s          # DaosSystem spec.systemName; omit for the client default
  #    agentSocketHostPath: /var/run/daos-operator/agent/daos-k8s   # spec.clientAgent's socket dir:
  #                                  # /var/run/daos-operator/agent/<DaosSystem name> unless hostSocketDir
  #                                  # is set. Default: that path for system.name when system.create is
  #                                  # true, else /var/run/daos_agent (a host daos_agent)
  #    # lmcacheCpuGB: 5             # LMCache CPU tier per process in front of DAOS; unset = LMCache's
  #    #                             # default (on, 5 GB), 0 = off (every hit is read from DAOS)
  #    # reuseStats: 300             # log lmcache-daos reuse statistics every N s: how often evicted
  #    #                             # chunks are asked for again, the numbers a tiering decision needs
  #    model:
  #      path: /data/hf_cache/hub/models--meta-llama--Llama-3.1-8B-Instruct/snapshots/0e9e39f2
  #      servedName: llama31-8b-daos
  #      cacheHostPath: /mnt/nvme1/hf_cache    # mounted at /data/hf_cache
  #    port: 8100                    # host port: hostNetwork, so it must be free on the node
  #    accelerator: nvidia           # nvidia (default) | rbln | custom
  #    # acceleratorResource: nvidia.com/gpu   # default from accelerator; required for custom
  #    # kvConnector: LMCacheConnectorV1       # default from accelerator; required for custom
  #    acceleratorCount: 1           # `gpus` is still accepted
  #    gpuMemoryUtilization: "0.90"  # nvidia only unless set; lower it when something else shares the GPU
  #    maxModelLen: 16384
  #    dtype: bfloat16
  #    runtimeClassName: nvidia      # GPU Operator / nvidia-container-toolkit on CRI-O
  #    nodeSelector: {"nvidia.com/gpu.present": "true"}
  #    # tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  #    imagePullSecret: ""
  #    resources: {requests: {cpu: "8", memory: 32Gi}}
  #    # lmcache-daos rank guard for a kvcache pool (DaosPool spec.profile: kvcache). Needs an
  #    # image whose lmcache-daos has it (lmcache-daos MR !50 and later).
  #    rankGuard:
  #      enabled: false
  #      oclass: S1                  # S1 for kvcache redundancy none, EC_2P1G1 for redundancy ec
  #      capacityGB: 0               # bound on what one instance keeps; start at <= 1/3 of the pool
  #      relocate: true              # default; S1 only: while a rank is down, store its keys on another
  #                                  # rank's bucket, so the cache keeps hitting (needs lmcache-daos with
  #                                  # relocation, vllm-lmcache-daos 0.30.0-0.5.5-20261021.2 and later;
  #                                  # older images ignore it). false turns it off
  #      # The keys below need vllm-lmcache-daos 0.30.0-0.5.5-20261025.2 or later and are passed only
  #      # when set; unset, the image default (shown) applies. lmcache-daos doc/EVICTION-DESIGN.md.
  #      # relocateBudgetGB: 0         # bytes relocated for one down rank before its writes are dropped;
  #      #                             # 0 = a quarter of capacityGB
  #      # eviction: s3fifo            # victim order: s3fifo | lru
  #      # spacePoll: 10               # s between free-space checks of the bucket targets; 0 turns the
  #      #                             # space checks (evictAt, admit*At) off
  #      # evictAt: 0.30               # evict the keys of a target whose free share is below this
  #      # admitNewAt: 0.15            # below this, refuse relocated writes to that target
  #      # admitAllAt: 0.05            # below this, refuse every write to that target
  #    kvLoadFailurePolicy: ""       # vLLM's own default is fail; recompute when rankGuard is on
  #    extraArgs: []                 # more vllm serve flags
  #    extraEnv: []
  #    # command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]   # default python3.12 -m ...
  #
  #  # Hybrid-attention models (Qwen3.5/3.8: linear GDN + full attention) need LMCache's
  #  # multi-process mode: the in-process connector does not support vLLM's hybrid KV manager.
  #  # lmcacheMode: mp runs the LMCache MP server (DAOS as L2 through libdfs) and vLLM with
  #  # LMCacheMPConnector in the one container (CUDA IPC). The values below are what ran
  #  # Qwen3.8-27B INT4 on an A100 over IB (moon, 2026-11-13; doc/deploy-gpu-k8s.md §5.6).
  #  - name: qwen38-daos
  #    image: <your-registry>/vllm-lmcache-daos:0.30.0-0.5.5
  #    lmcacheMode: mp               # inprocess (default) | mp; nvidia/custom only, no rankGuard
  #    poolRef: kvc
  #    containerRef: kvdfs           # POSIX, SX, 4 MiB chunks: the adapter reads it through DFS
  #    systemName: daos_moon
  #    lmcacheChunkSize: 784         # a multiple of vLLM's block for the model (784 for Qwen3.8)
  #    mp:
  #      l1SizeGB: 14                # LMCache L1 (host memory); must hold one whole request
  #      l2StorePolicy: skip_l1      # store straight to DAOS (optional)
  #      workers: 16                 # adapter I/O threads
  #      maxCapacityGB: 600          # bound on what this server keeps in the container (optional)
  #      # port: <port + 10000>        # the node's (hostNetwork); unique per node, an occupied port fails the pod
  #      # root: /mp, evictionPolicy: LRU, startTimeoutSeconds: 300, extraArgs: []   # defaults / more server flags
  #    # kvConnector: LMCacheMPConnector         # default for mp; DaosMPConnector + kvConnectorModulePath:
  #    #                                         # lmcache_daos.mp.vllm_connector for vLLM 0.18
  #    shmSizeLimit: 16Gi            # /dev/shm (default 8Gi)
  #    readinessFailureThreshold: 90 # x 10 s; a 27B model with a 256K context takes a while
  #    rdma: true
  #    maxModelLen: 262144
  #    model: {path: /models/Qwen3.8-27B-INT4, servedName: qwen3.8-27b}
  #    extraArgs: [--enable-prefix-caching, --mamba-cache-mode=align,   # prefix caching must be on
  #                --attention-backend=TRITON_ATTN, --kv-cache-dtype=bfloat16]   # no nvcc; SM80 has no FP8 KV in Triton
  #
  #  # Rebellions NPU (vllm-rbln). The image must carry vllm-rbln 0.12+ with the kv_connectors
  #  # extra (lmcache-rbln, from pypi.rbln.ai) and lmcache-daos; we do not build one. Rendered,
  #  # not yet run on RBLN hardware. NPUs come in through CDI, so no runtimeClassName.
  #  # Older RBLN device plugins advertise rebellions.ai/ATOM: set acceleratorResource to match.
  #  - name: vllm-daos-rbln
  #    image: <your-registry>/vllm-rbln-lmcache-daos:<tag>
  #    accelerator: rbln             # rebellions.ai/npu + RBLNLMCacheConnectorV1
  #    acceleratorCount: 1
  #    poolRef: podpool
  #    containerRef: kvlmc
  #    model: {path: /data/hf_cache/<compiled-model-dir>, servedName: rbln-daos, cacheHostPath: /mnt/hf_cache}
  #    port: 8101
  #    rdma: true
  #    lmcacheChunkSize: 256         # LMCache chunk_size (default 256); Rebellions recommends the --block-size
  #    # modelImpl: vllm             # --model-impl; rbln defaults to vllm (required by RBLNLMCacheConnectorV1)

# S3 gateways (versitygw-daos) in front of a DaosPool, one S3Service per entry.
# The operator supplies --pool/--system, the daos_agent sidecar and the certificates;
# see doc/adr/ADR-004-s3-gateway.md.
#
# The versitygw-daos image lives in our internal registry only: it carries a fork
# whose source is not public, so we do not mirror it. The build recipe is public:
# images/versitygw/ in github.com/gluesys/daos-images.
s3:
  services: []
  #  - name: s3
  #    poolRef: kv                    # an existing DaosPool
  #    image: <your-registry>/versitygw-daos:<tag>   # internal: registry.gitlab.gluesys.com/exastor/daos-images/versitygw-daos:2.8.0-20261123-vgw53afe7e5 -- never the plain 2.8.0-20260923 tag: it crashes the DAOS 2.8 engine (#28)
  #    replicas: 1
  #    port: 7070
  #    region: kr-1
  #    serviceType: ClusterIP         # or NodePort / LoadBalancer
  #    # nodePort: 30707
  #    # tlsSecretName: s3-tls        # kubernetes.io/tls, served by the gateway
  #    # Root key. Either point at an existing Secret ...
  #    rootCredentialsSecret: s3root
  #    # ... or have the chart create it. Helm values end up in the release secret,
  #    # so prefer an existing Secret outside a demo.
  #    # rootCredentials:
  #    #   accessKey: ""
  #    #   secretKey: ""
  #    # S3 users and keys live here. Without a claim they are lost when the pod
  #    # restarts (the objects in DAOS are not), and replicas > 1 is refused.
  #    # iam: {type: internal, claimName: s3-iam}
  #    # nodeSelector: {}
  #    # tolerations: []
  #    # resources: {}
  #    # extraEnv: []
