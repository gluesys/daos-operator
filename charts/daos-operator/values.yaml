#
# daos-operator Helm values. The chart installs the CRDs (crds/), the operator
# Deployment with its RBAC, the ClusterRole the host-preparation DaemonSet
# binds to, and optionally the DAOS Grafana dashboard ConfigMap and one
# DaosSystem. Everything else (hostprep DaemonSet, server StatefulSets,
# metrics Service/ServiceMonitor, dmg Jobs) is created by the operator.

image:
  repository: registry.gitlab.gluesys.com/exastor/daos-operator/daos-operator
  tag: ""            # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1
leaderElect: true
# --metrics-bind-address for the operator's own controller-runtime metrics ("0" = off)
metricsBindAddress: "0"
logLevel: info

resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

serviceAccount:
  create: true
  name: ""           # defaults to the release fullname
  annotations: {}

rbac:
  create: true

# ClusterRole "daos-hostprep" that the operator binds to the per-system hostprep ServiceAccount.
hostprep:
  clusterRole: daos-hostprep
  # image the operator uses when DaosSystem.spec.images.hostPrep is empty ("" = operator default)
  defaultImage: ""

grafana:
  dashboard:
    # ConfigMap with the upstream DAOS Grafana dashboard, labelled for the grafana sidecar
    enabled: false
    namespace: ""    # defaults to the release namespace
    label: grafana_dashboard
    labelValue: "1"

# Create one DaosSystem with the release. spec is passed through as-is (see
# api/v1alpha1 for the fields); the operator fills status.
system:
  create: false
  name: daos
  spec:
    version: "2.8.0"
    namespace: daos-system
    images:
      server: registry.gitlab.gluesys.com/exastor/daos-images/daos-server:2.8.0-20260914
      agent: registry.gitlab.gluesys.com/exastor/daos-images/daos-agent:2.8.0-20260914
      admin: registry.gitlab.gluesys.com/exastor/daos-images/daos-admin:2.8.0-20260914
      client: registry.gitlab.gluesys.com/exastor/daos-images/daos-client:2.8.0-20260914
    placement: dedicated
    nodeSelector:
      daos.gluesys.com/role: storage
    msReplicas: 1
    provider: "ofi+verbs;ofi_rxm"
    nrHugepages: 8192
    allowInsecure: true
    engines:
      - targets: 8
        helpers: 2
        scmSizeGiB: 32
    hostPrep:
      enabled: true
      bindNvme: false

# exastor/daos-csi: CSI driver (controller Deployment + node DaemonSet with a
# daos_agent sidecar). One driver per DaosSystem: csi.system names the system
# whose <system>-agent ConfigMap (and <system>-certs when tls) the node plugin uses.
csi:
  enabled: false
  system: ""              # defaults to system.name
  driverName: daos.csi.gluesys.com
  image:
    repository: registry.gitlab.gluesys.com/exastor/daos-csi/daos-csi
    tag: ""               # defaults to .Chart.appVersion
    pullPolicy: IfNotPresent
  agentImage: ""          # defaults to system.spec.images.agent
  tls: false              # mount <system>-certs (agent set for the sidecar, admin set for the daos client)
  sidecars:
    provisioner: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
    registrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
  kubeletDir: /var/lib/kubelet
  nodeSelector: {}        # nodes that may mount DAOS PVs (default: all)
  tolerations:
    - operator: Exists
  controllerResources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  nodeResources:
    requests: {cpu: 50m, memory: 128Mi}
  # StorageClasses to create, one per DaosPool
  storageClasses: []
  #  - name: daos-kv
  #    reclaimPolicy: Delete
  #    parameters: {pool: kv, oclass: RP_2GX, dirOclass: RP_2G1, chunkSize: "4194304", csum: crc32}

# vLLM serving with LMCache writing its KV cache to a DAOS container.
# This is a reference workload, not part of the storage layer: it is here so a
# GPU cluster can be brought up with one release. See doc/deploy-gpu-k8s.md.
#
# The pod runs with hostNetwork because a DAOS client must be reachable at the
# address it advertises; a pod-network client behind the CNI's masquerade is
# not (that is also why spec.clientAgent must be enabled on the GPU nodes).
vllm:
  services: []
  #  - name: vllm-daos
  #    image: registry.gitlab.gluesys.com/exastor/daos-images/vllm-lmcache-daos:0.30.0-0.5.5-20260927
  #    # KV cache target: an existing DaosPool and DaosContainer (POSIX, chunk 4 MiB)
  #    poolRef: podpool
  #    containerRef: kvlmc
  #    systemName: daos_k8s          # DaosSystem spec.systemName; omit for the client default
  #    agentSocketHostPath: /var/run/daos_agent/daos-k8s   # spec.clientAgent's socket dir
  #    model:
  #      path: /data/hf_cache/hub/models--meta-llama--Llama-3.1-8B-Instruct/snapshots/0e9e39f2
  #      servedName: llama31-8b-daos
  #      cacheHostPath: /mnt/nvme1/hf_cache    # mounted at /data/hf_cache
  #    port: 8100                    # host port: hostNetwork, so it must be free on the node
  #    gpus: 1
  #    gpuMemoryUtilization: "0.90"  # lower it when something else shares the GPU
  #    maxModelLen: 16384
  #    dtype: bfloat16
  #    runtimeClassName: nvidia      # GPU Operator / nvidia-container-toolkit on CRI-O
  #    nodeSelector: {"nvidia.com/gpu.present": "true"}
  #    # tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  #    imagePullSecret: ""
  #    resources: {requests: {cpu: "8", memory: 32Gi}}
  #    extraArgs: []                 # more vllm serve flags
  #    extraEnv: []

# S3 gateways (versitygw-daos) in front of a DaosPool, one S3Service per entry.
# The operator supplies --pool/--system, the daos_agent sidecar and the certificates;
# see doc/adr/ADR-004-s3-gateway.md.
s3:
  services: []
  #  - name: s3
  #    poolRef: kv                    # an existing DaosPool
  #    image: registry.gitlab.gluesys.com/exastor/daos-images/versitygw-daos:2.8.0-20260923
  #    replicas: 1
  #    port: 7070
  #    region: kr-1
  #    serviceType: ClusterIP         # or NodePort / LoadBalancer
  #    # nodePort: 30707
  #    # tlsSecretName: s3-tls        # kubernetes.io/tls, served by the gateway
  #    # Root key. Either point at an existing Secret ...
  #    rootCredentialsSecret: s3root
  #    # ... or have the chart create it. Helm values end up in the release secret,
  #    # so prefer an existing Secret outside a demo.
  #    # rootCredentials:
  #    #   accessKey: ""
  #    #   secretKey: ""
