apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daos-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "daos-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "daos-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "daos-operator.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "daos-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "daos-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/manager]
          args:
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- else }}
            - --metrics-bind-address={{ .Values.metricsBindAddress }}
            {{- end }}
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
            {{- if .Values.interception.enabled }}
            - --interception
            - --interception-system={{ .Values.csi.system | default .Values.system.name }}
            - --interception-csi-driver={{ .Values.csi.driverName }}
            - --interception-ibv-drivers={{ .Values.interception.ibvDrivers }}
            - --interception-rdma-resources={{ join "," .Values.interception.rdmaResources }}
            - --interception-default-pod-security={{ .Values.interception.defaultPodSecurity }}
            - --webhook-service={{ include "daos-operator.fullname" . }}-webhook
            - --webhook-secret={{ include "daos-operator.fullname" . }}-webhook-cert
            - --webhook-config={{ include "daos-operator.fullname" . }}-interception
            {{- end }}
          env:
            - name: DAOS_HOSTPREP_DEFAULT_IMAGE
              value: {{ include "daos-operator.hostprepImage" . | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          ports:
            {{- if .Values.interception.enabled }}
            - name: webhook
              containerPort: 9443
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.interception.enabled }}
          volumeMounts:
            # the operator writes the webhook certificate here (read-only root filesystem)
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
          {{- end }}
      {{- if .Values.interception.enabled }}
      volumes:
        - name: webhook-certs
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
