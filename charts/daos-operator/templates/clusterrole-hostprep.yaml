{{- if .Values.rbac.create }}
# Bound by the operator to the per-system "daos-hostprep" ServiceAccount
# (config/rbac/hostprep_role.yaml). Name must match the operator's constant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.hostprep.clusterRole }}
  labels:
    {{- include "daos-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, update]
{{- end }}
