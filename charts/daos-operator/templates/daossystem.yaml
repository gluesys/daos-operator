{{- if .Values.system.create }}
apiVersion: daos.gluesys.com/v1alpha1
kind: DaosSystem
metadata:
  name: {{ .Values.system.name }}
  labels:
    {{- include "daos-operator.labels" . | nindent 4 }}
  annotations:
    # keep the system when the release is uninstalled: uninstall must never stop engines
    helm.sh/resource-policy: keep
{{- /* the operator's pods pull with the release's secrets unless the system names its own */}}
{{- $spec := deepCopy .Values.system.spec }}
{{- if and .Values.imagePullSecrets (not (hasKey $spec "imagePullSecrets")) }}
{{- $_ := set $spec "imagePullSecrets" .Values.imagePullSecrets }}
{{- end }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
