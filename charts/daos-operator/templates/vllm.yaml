{{- /*
SPDX-License-Identifier: Apache-2.0
Copyright 2026 Gluesys Co., Ltd.

Reference serving workload: vLLM + LMCache with a DAOS container as the KV
cache (doc/deploy-gpu-k8s.md). One Deployment + Service + LMCache ConfigMap per
entry in .Values.vllm.services.

hostNetwork is not optional: daos_agent hands the client an interface name and
the servers must be able to reach the client at the address it advertises. A
pod-network client sits behind the CNI's masquerade, so its advertised address
does not match its source address and every RPC ends in DER_TIMEDOUT.

Set rdma: true when the DAOS system runs on an RDMA provider (ofi+verbs, ucx).
The client then needs the verbs devices themselves: without /dev/infiniband the
libfabric verbs provider fails to initialise (na_ofi_provider_check) and the
connector never comes up. A tcp system does not need any of this.

rdmaResource names a resource from an RDMA device plugin (the NVIDIA Network
Operator's rdmaSharedDevicePlugin advertises rdma/rdma_shared_device_a) and is
the better option where one exists: the plugin injects the verbs devices the
container needs, so the pod drops both the /dev/infiniband hostPath and
privileged, and keeps IPC_LOCK for memory registration. Measured on a 400G RoCE
link with no loss of speed -- 64 MiB round trip, 2777 MB/s write and
12162 MB/s read without privileged (doc/deploy-gpu-k8s.md). It takes precedence
over rdma when both are set.

accelerator picks the device the server runs on and the defaults that go with
it; every default can be overridden on its own:

  accelerator  resource            kvConnector             notes
  nvidia       nvidia.com/gpu      LMCacheConnectorV1      the default; adds
                                                           --gpu-memory-utilization
                                                           and the flashinfer guard
  rbln         rebellions.ai/npu   RBLNLMCacheConnectorV1  Rebellions NPU via the
                                                           vllm-rbln plugin
  custom       (required)          (required)

rbln: the connector comes from lmcache-rbln, which only the vllm-rbln 0.12
line ships (not on PyPI); lmcache-daos plugs in behind it as a
remote_storage_plugins entry, so the image has to carry vllm-rbln,
lmcache-rbln and lmcache-daos together. Older RBLN device plugins advertise
rebellions.ai/ATOM instead of rebellions.ai/npu -- set acceleratorResource to
what `kubectl describe node` shows. The RBLN device plugin injects the NPUs
through CDI, so no runtimeClassName is needed there.
*/}}
{{- range .Values.vllm.services }}
{{- $ns := $.Values.system.spec.namespace | default "daos-system" }}
{{- $port := .port | default 8100 }}
{{- $acc := .accelerator | default "nvidia" }}
{{- $presets := dict
      "nvidia" (dict "resource" "nvidia.com/gpu" "kvConnector" "LMCacheConnectorV1")
      "rbln" (dict "resource" "rebellions.ai/npu" "kvConnector" "RBLNLMCacheConnectorV1")
      "custom" (dict) }}
{{- if not (hasKey $presets $acc) }}
{{- fail (printf "vllm.services[%s].accelerator must be nvidia, rbln or custom, not %q" .name $acc) }}
{{- end }}
{{- $preset := get $presets $acc }}
{{- $accResource := .acceleratorResource | default (get $preset "resource") }}
{{- $kvConnector := .kvConnector | default (get $preset "kvConnector") }}
{{- if not $accResource }}
{{- fail (printf "vllm.services[%s]: accelerator %s needs acceleratorResource" .name $acc) }}
{{- end }}
{{- if not $kvConnector }}
{{- fail (printf "vllm.services[%s]: accelerator %s needs kvConnector" .name $acc) }}
{{- end }}
{{- $accCount := .acceleratorCount | default .gpus | default 1 }}
{{- $guard := .rankGuard | default dict }}
{{- $url := printf "plugin://daos/%s/%s%s" (required "vllm.services[].poolRef is required" .poolRef) (required "vllm.services[].containerRef is required" .containerRef) (ternary (printf "?sys=%s" .systemName) "" (not (empty .systemName))) }}
{{- $failPolicy := .kvLoadFailurePolicy | default (ternary "recompute" "" (eq ($guard.enabled | toString) "true")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-lmcache
  namespace: {{ $ns }}
  labels:
    {{- include "daos-operator.labels" $ | nindent 4 }}
data:
  lmcache_daos.yaml: |
    chunk_size: 256
    {{- /* plugin route only: with remote_url as well LMCache 0.5.5 builds two
    RemoteBackends on one container, so every chunk is stored twice.
    The target comes from extra_config, which needs lmcache-daos MR !50 or
    later (vllm-lmcache-daos 0.30.0-0.5.5-20261020 and later). */}}
    remote_serde: "naive"
    remote_storage_plugins: ["daos"]
    extra_config:
      remote_storage_plugin.daos.url: "{{ $url }}"
      remote_storage_plugin.daos.module_path: lmcache_daos.connector
      remote_storage_plugin.daos.class_name: DaosConnector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "daos-operator.labels" $ | nindent 4 }}
    app: {{ .name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .name }}}
  template:
    metadata:
      labels:
        {{- include "daos-operator.labels" $ | nindent 8 }}
        app: {{ .name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ required "vllm.services[].image is required" .image }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          command: ["python3.12", "-m", "vllm.entrypoints.openai.api_server"]
          {{- end }}
          args:
            - --model={{ required "vllm.services[].model.path is required" .model.path }}
            {{- with .model.servedName }}
            - --served-model-name={{ . }}
            {{- end }}
            - --host=0.0.0.0
            - --port={{ $port }}
            - --dtype={{ .dtype | default "bfloat16" }}
            - --max-model-len={{ .maxModelLen | default 16384 }}
            {{- if or (eq $acc "nvidia") .gpuMemoryUtilization }}
            - --gpu-memory-utilization={{ .gpuMemoryUtilization | default "0.90" }}
            {{- end }}
            - --kv-transfer-config={"kv_connector":"{{ $kvConnector }}","kv_role":"kv_both"{{ with $failPolicy }},"kv_load_failure_policy":"{{ . }}"{{ end }}}
            {{- range .extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - {name: LMCACHE_CONFIG_FILE, value: /etc/lmcache/lmcache_daos.yaml}
            - {name: DAOS_AGENT_DRPC_DIR, value: /var/run/daos_agent}
            # lmcache-daos keys are hashed per process; they must match across restarts
            - {name: PYTHONHASHSEED, value: "0"}
            {{- if eq $acc "nvidia" }}
            # no CUDA toolchain in the image: the flashinfer sampler would try to JIT-compile
            - {name: VLLM_USE_FLASHINFER_SAMPLER, value: "0"}
            {{- end }}
            {{- if .model.cacheHostPath }}
            - {name: HF_HOME, value: /data/hf_cache}
            - {name: HF_HUB_OFFLINE, value: "1"}
            {{- end }}
            {{- if $guard.enabled }}
            # lmcache-daos rank guard: per-request deadlines, a breaker per rank
            # (or per pool on EC buckets), capacity-bounded eviction
            - {name: DAOS_RANK_GUARD, value: "1"}
            - {name: DAOS_RANK_GUARD_OCLASS, value: {{ $guard.oclass | default "S1" | quote }}}
            {{- with $guard.capacityGB }}
            - {name: DAOS_RANK_GUARD_CAPACITY_GB, value: {{ . | quote }}}
            {{- end }}
            {{- $relocate := true }}
            {{- if hasKey $guard "relocate" }}{{ $relocate = $guard.relocate }}{{ end }}
            {{- if and $relocate (eq ($guard.oclass | default "S1") "S1") }}
            # keys whose home rank is down go to another rank's bucket and are read
            # back from there (lmcache-daos doc/RANK-GUARD-RELOCATION.md); S1 only, on
            # unless rankGuard.relocate is false. An image without relocation ignores it
            - {name: DAOS_RANK_GUARD_RELOCATE, value: "1"}
            {{- end }}
            {{- end }}
            {{- with .extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .rdmaResource }}
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          {{- else if .rdma }}
          securityContext:
            privileged: true
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          resources:
            limits:
              {{ $accResource }}: {{ $accCount }}
              {{- if .rdmaResource }}
              {{ .rdmaResource }}: {{ .rdmaResourceCount | default 1 }}
              {{- end }}
            {{- with .resources }}
            {{- if .requests }}
            requests:
              {{- toYaml .requests | nindent 14 }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - {name: agent-sock, mountPath: /var/run/daos_agent}
            - {name: lmcache-config, mountPath: /etc/lmcache, readOnly: true}
            {{- if .model.cacheHostPath }}
            - {name: hf-cache, mountPath: /data/hf_cache}
            {{- end }}
            - {name: shm, mountPath: /dev/shm}
            {{- if and .rdma (not .rdmaResource) }}
            - {name: ib-dev, mountPath: /dev/infiniband}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health, port: {{ $port }}}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 60
      volumes:
        - name: agent-sock
          hostPath:
            path: {{ .agentSocketHostPath | default "/var/run/daos_agent" }}
            type: Directory
        - name: lmcache-config
          configMap: {name: {{ .name }}-lmcache}
        {{- if .model.cacheHostPath }}
        - name: hf-cache
          hostPath: {path: {{ .model.cacheHostPath }}, type: Directory}
        {{- end }}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
        {{- if and .rdma (not .rdmaResource) }}
        - name: ib-dev
          hostPath: {path: /dev/infiniband, type: Directory}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "daos-operator.labels" $ | nindent 4 }}
spec:
  selector: {app: {{ .name }}}
  ports:
    - {name: http, port: {{ $port }}, targetPort: {{ $port }}}
---
{{- end }}
