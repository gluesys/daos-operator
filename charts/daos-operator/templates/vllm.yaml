{{- /*
SPDX-License-Identifier: Apache-2.0
Copyright 2026 Gluesys Co., Ltd.

Reference serving workload for PoCs, demos and tests: vLLM + LMCache with a DAOS
container as the KV cache (doc/deploy-gpu-k8s.md). Not production serving -- that
belongs to the user's own stack, which follows doc/serving-integration.md. One Deployment + Service + LMCache ConfigMap per
entry in .Values.vllm.services.

hostNetwork is not optional: daos_agent hands the client an interface name and
the servers must be able to reach the client at the address it advertises. A
pod-network client sits behind the CNI's masquerade, so its advertised address
does not match its source address and every RPC ends in DER_TIMEDOUT.

Set rdma: true when the DAOS system runs on an RDMA provider (ofi+verbs, ucx).
The client then needs the verbs devices themselves: without /dev/infiniband the
libfabric verbs provider fails to initialise (na_ofi_provider_check) and the
connector never comes up. A tcp system does not need any of this.

rdmaResource names a resource from an RDMA device plugin (the NVIDIA Network
Operator's rdmaSharedDevicePlugin advertises rdma/rdma_shared_device_a) and is
the better option where one exists: the plugin injects the verbs devices the
container needs, so the pod drops both the /dev/infiniband hostPath and
privileged, and keeps IPC_LOCK for memory registration. Measured on a 400G RoCE
link with no loss of speed -- 64 MiB round trip, 2777 MB/s write and
12162 MB/s read without privileged (doc/deploy-gpu-k8s.md). It takes precedence
over rdma when both are set.

accelerator picks the device the server runs on and the defaults that go with
it; every default can be overridden on its own:

  accelerator  resource            kvConnector             notes
  nvidia       nvidia.com/gpu      LMCacheConnectorV1      the default; adds
                                                           --gpu-memory-utilization
                                                           and the flashinfer guard
  rbln         rebellions.ai/npu   RBLNLMCacheConnectorV1  Rebellions NPU via the
                                                           vllm-rbln plugin
  custom       (required)          (required)

rbln: the connector comes from lmcache-rbln (vllm-rbln[kv_connectors] 0.12,
from pypi.rbln.ai, not PyPI). lmcache-rbln 0.12.0 runs on stock LMCache 0.5.4,
whose remote_storage_plugins path is the one lmcache-daos uses on 0.5.5, so
lmcache-daos plugs in behind it; the image has to carry vllm-rbln,
lmcache-rbln and lmcache-daos together. rbln also passes --model-impl=vllm
(the connector is not imported on the transformers path); set
lmcacheChunkSize to the --block-size, as Rebellions recommends. Older RBLN device plugins advertise
rebellions.ai/ATOM instead of rebellions.ai/npu -- set acceleratorResource to
what `kubectl describe node` shows. The RBLN device plugin injects the NPUs
through CDI, so no runtimeClassName is needed there.

lmcacheMode: mp runs LMCache in multi-process mode: an LMCache MP cache server
(lmcache_daos.mp.server, DAOS as its L2 through libdfs) and vLLM with
LMCacheMPConnector, in the one container -- vLLM hands the server its KV
buffers over CUDA IPC, and a second container would need a GPU of its own.
Hybrid-attention models (Qwen3.5/3.8: linear GDN + full attention) start only
this way; the in-process connector does not support vLLM's hybrid KV manager
(moon, 2026-11-13). Settings come from .mp, not from an LMCache config file.
The MP adapter reads the container through DFS, so it wants a POSIX container
and does not use the rank guard.
*/}}
{{- range .Values.vllm.services }}
{{- $ns := $.Values.system.spec.namespace | default "daos-system" }}
{{- $port := .port | default 8100 }}
{{- $acc := .accelerator | default "nvidia" }}
{{- $presets := dict
      "nvidia" (dict "resource" "nvidia.com/gpu" "kvConnector" "LMCacheConnectorV1")
      "rbln" (dict "resource" "rebellions.ai/npu" "kvConnector" "RBLNLMCacheConnectorV1")
      "custom" (dict) }}
{{- if not (hasKey $presets $acc) }}
{{- fail (printf "vllm.services[%s].accelerator must be nvidia, rbln or custom, not %q" .name $acc) }}
{{- end }}
{{- $preset := get $presets $acc }}
{{- $mode := .lmcacheMode | default "inprocess" }}
{{- if not (has $mode (list "inprocess" "mp")) }}
{{- fail (printf "vllm.services[%s].lmcacheMode must be inprocess or mp, not %q" .name $mode) }}
{{- end }}
{{- $isMP := eq $mode "mp" }}
{{- $mp := .mp | default dict }}
{{- if and $isMP (eq $acc "rbln") }}
{{- fail (printf "vllm.services[%s]: lmcacheMode mp is not available with accelerator rbln (its connector is in-process)" .name) }}
{{- end }}
{{- if and $isMP .rankGuard }}{{ if .rankGuard.enabled }}
{{- fail (printf "vllm.services[%s]: rankGuard is in-process only; the MP adapter reads a POSIX container through DFS" .name) }}
{{- end }}{{ end }}
{{- if $isMP }}{{ $_ := set $preset "kvConnector" "LMCacheMPConnector" }}{{ end }}
{{- $accResource := .acceleratorResource | default (get $preset "resource") }}
{{- $kvConnector := .kvConnector | default (get $preset "kvConnector") }}
{{- if not $accResource }}
{{- fail (printf "vllm.services[%s]: accelerator %s needs acceleratorResource" .name $acc) }}
{{- end }}
{{- if not $kvConnector }}
{{- fail (printf "vllm.services[%s]: accelerator %s needs kvConnector" .name $acc) }}
{{- end }}
{{- $accCount := .acceleratorCount | default .gpus | default 1 }}
{{- $guard := .rankGuard | default dict }}
{{- $modelImpl := .modelImpl | default (ternary "vllm" "" (eq $acc "rbln")) }}
{{- /* the operator's client agent socket dir (spec.clientAgent.hostSocketDir default) when this
chart creates the DaosSystem; otherwise the host daos_agent's own directory */}}
{{- $agentDir := .agentSocketHostPath | default (ternary (printf "/var/run/daos-operator/agent/%s" $.Values.system.name) "/var/run/daos_agent" (eq ($.Values.system.create | toString) "true")) }}
{{- $url := printf "plugin://daos/%s/%s%s" (required "vllm.services[].poolRef is required" .poolRef) (required "vllm.services[].containerRef is required" .containerRef) (ternary (printf "?sys=%s" .systemName) "" (not (empty .systemName))) }}
{{- $failPolicy := .kvLoadFailurePolicy | default (ternary "recompute" "" (eq ($guard.enabled | toString) "true")) }}
{{- /* hostNetwork: the MP port is the node's. Derived from the vLLM port (itself unique per
node, §5.4) so two mp services on one node do not meet on a shared default. */}}
{{- $mpPort := $mp.port | default (add $port 10000) }}
{{- $chunk := .lmcacheChunkSize | default 256 }}
{{- if not $isMP }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-lmcache
  namespace: {{ $ns }}
  labels:
    {{- include "daos-operator.labels" $ | nindent 4 }}
data:
  lmcache_daos.yaml: |
    chunk_size: {{ .lmcacheChunkSize | default 256 }}
    {{- /* LMCache's CPU tier in front of DAOS. Unset leaves LMCache's default (on,
    5 GB per process); 0 turns it off so every hit is read from DAOS. */}}
    {{- if hasKey . "lmcacheCpuGB" }}
    {{- if eq (toString .lmcacheCpuGB) "0" }}
    local_cpu: false
    {{- else }}
    local_cpu: true
    max_local_cpu_size: {{ .lmcacheCpuGB }}
    {{- end }}
    {{- end }}
    {{- /* plugin route only: with remote_url as well LMCache 0.5.5 builds two
    RemoteBackends on one container, so every chunk is stored twice.
    The target comes from extra_config, which needs lmcache-daos MR !50 or
    later (vllm-lmcache-daos 0.30.0-0.5.5-20261020 and later). */}}
    remote_serde: "naive"
    remote_storage_plugins: ["daos"]
    extra_config:
      remote_storage_plugin.daos.url: "{{ $url }}"
      remote_storage_plugin.daos.module_path: lmcache_daos.connector
      remote_storage_plugin.daos.class_name: DaosConnector
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "daos-operator.labels" $ | nindent 4 }}
    app: {{ .name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .name }}}
  template:
    metadata:
      labels:
        {{- include "daos-operator.labels" $ | nindent 8 }}
        app: {{ .name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ required "vllm.services[].image is required" .image }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          {{- if $isMP }}
          {{- /* the MP server first; vLLM once its port is open. The args below reach
          vLLM as "$@". The adapter JSON comes in through the environment, so pool
          and container names need no shell quoting. */}}
          command:
            - bash
            - -c
            - |
              set -e
              port={{ $mpPort }}
              # hostNetwork: a listener already on the port is not ours -- connecting to it would
              # hand vLLM another service's cache server (and its pool/container)
              if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then
                echo "port $port is already in use on this node: set vllm.services[].mp.port" >&2; exit 1
              fi
              python3.12 -m lmcache_daos.mp.server --host 127.0.0.1 --port {{ $mpPort }} \
                --chunk-size {{ $chunk }} --l1-size-gb {{ $mp.l1SizeGB | default 20 }} \
                --eviction-policy {{ $mp.evictionPolicy | default "LRU" }} --disable-observability \
                {{- with $mp.l2StorePolicy }}
                --l2-store-policy {{ . }} \
                {{- end }}
                {{- range $mp.extraArgs }}
                {{ . }} \
                {{- end }}
                --l2-adapter "$DAOS_MP_L2_ADAPTER" &
              srv=$!
              up=
              for i in $(seq 1 {{ $mp.startTimeoutSeconds | default 300 }}); do
                kill -0 $srv 2>/dev/null || { echo "lmcache MP server exited before listening" >&2; exit 1; }
                if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then up=1; break; fi
                sleep 1
              done
              [ -n "$up" ] || { echo "lmcache MP server did not listen on $port in ${i} s" >&2; exit 1; }
              # the listener must still be our child (it could have died on EADDRINUSE meanwhile)
              kill -0 $srv 2>/dev/null || { echo "lmcache MP server exited" >&2; exit 1; }
              echo "lmcache MP server listening on $port after ${i} s"
              exec python3.12 -m vllm.entrypoints.openai.api_server "$@"
            - vllm
          {{- else }}
          command: ["python3.12", "-m", "vllm.entrypoints.openai.api_server"]
          {{- end }}
          {{- end }}
          args:
            - --model={{ required "vllm.services[].model.path is required" .model.path }}
            {{- with .model.servedName }}
            - --served-model-name={{ . }}
            {{- end }}
            - --host=0.0.0.0
            - --port={{ $port }}
            - --dtype={{ .dtype | default "bfloat16" }}
            - --max-model-len={{ .maxModelLen | default 16384 }}
            {{- with $modelImpl }}
            - --model-impl={{ . }}
            {{- end }}
            {{- if or (eq $acc "nvidia") .gpuMemoryUtilization }}
            - --gpu-memory-utilization={{ .gpuMemoryUtilization | default "0.90" }}
            {{- end }}
            {{- if $isMP }}
            - --kv-transfer-config={"kv_connector":"{{ $kvConnector }}",{{ with .kvConnectorModulePath }}"kv_connector_module_path":"{{ . }}",{{ end }}"kv_role":"kv_both"{{ with $failPolicy }},"kv_load_failure_policy":"{{ . }}"{{ end }},"kv_connector_extra_config":{"lmcache.mp.host":"tcp://127.0.0.1","lmcache.mp.port":{{ $mpPort }}}}
            {{- else }}
            - --kv-transfer-config={"kv_connector":"{{ $kvConnector }}","kv_role":"kv_both"{{ with $failPolicy }},"kv_load_failure_policy":"{{ . }}"{{ end }}}
            {{- end }}
            {{- range .extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            {{- if $isMP }}
            {{- $adapter := dict "type" "daos" "pool" .poolRef "container" .containerRef "root" ($mp.root | default "/mp") "workers" ($mp.workers | default 16) }}
            {{- with .systemName }}{{ $_ := set $adapter "sys" . }}{{ end }}
            {{- with $mp.maxCapacityGB }}{{ $_ := set $adapter "max_capacity_gb" . }}{{ end }}
            - {name: DAOS_MP_L2_ADAPTER, value: {{ $adapter | toJson | quote }}}
            {{- else }}
            - {name: LMCACHE_CONFIG_FILE, value: /etc/lmcache/lmcache_daos.yaml}
            {{- end }}
            - {name: DAOS_AGENT_DRPC_DIR, value: /var/run/daos_agent}
            # lmcache-daos keys are hashed per process; they must match across restarts
            - {name: PYTHONHASHSEED, value: "0"}
            {{- if eq $acc "nvidia" }}
            # no CUDA toolchain in the image: the flashinfer sampler would try to JIT-compile
            - {name: VLLM_USE_FLASHINFER_SAMPLER, value: "0"}
            {{- end }}
            {{- if .model.cacheHostPath }}
            - {name: HF_HOME, value: /data/hf_cache}
            - {name: HF_HUB_OFFLINE, value: "1"}
            {{- end }}
            {{- with .reuseStats }}
            # one "DAOS reuse stats" JSON line this often: how often evicted chunks are
            # asked for again (lmcache-daos doc/REUSE-STATS.md). An older image ignores it
            - {name: DAOS_REUSE_STATS, value: {{ . | toString | quote }}}
            {{- end }}
            {{- if $guard.enabled }}
            # lmcache-daos rank guard: per-request deadlines, a breaker per rank
            # (or per pool on EC buckets), capacity-bounded eviction
            - {name: DAOS_RANK_GUARD, value: "1"}
            - {name: DAOS_RANK_GUARD_OCLASS, value: {{ $guard.oclass | default "S1" | quote }}}
            {{- with $guard.capacityGB }}
            - {name: DAOS_RANK_GUARD_CAPACITY_GB, value: {{ . | quote }}}
            {{- end }}
            {{- $relocate := true }}
            {{- if hasKey $guard "relocate" }}{{ $relocate = $guard.relocate }}{{ end }}
            {{- if and $relocate (eq ($guard.oclass | default "S1") "S1") }}
            # keys whose home rank is down go to another rank's bucket and are read
            # back from there (lmcache-daos doc/RANK-GUARD-RELOCATION.md); S1 only, on
            # unless rankGuard.relocate is false. An image without relocation ignores it
            - {name: DAOS_RANK_GUARD_RELOCATE, value: "1"}
            {{- end }}
            {{- /* space-aware admission and eviction (lmcache-daos doc/EVICTION-DESIGN.md,
            vllm-lmcache-daos 0.30.0-0.5.5-20261025.2 and later). Only keys that are set
            are passed, so the image's defaults apply otherwise; hasKey keeps spacePoll: 0
            (space checks off) from being dropped. */}}
            {{- range $key, $env := dict "relocateBudgetGB" "RELOCATE_BUDGET_GB" "eviction" "EVICTION" "spacePoll" "SPACE_POLL" "evictAt" "EVICT_AT" "admitNewAt" "ADMIT_NEW_AT" "admitAllAt" "ADMIT_ALL_AT" }}
            {{- if hasKey $guard $key }}
            - {name: DAOS_RANK_GUARD_{{ $env }}, value: {{ get $guard $key | toString | quote }}}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .rdmaResource }}
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          {{- else if .rdma }}
          securityContext:
            privileged: true
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          resources:
            limits:
              {{ $accResource }}: {{ $accCount }}
              {{- if .rdmaResource }}
              {{ .rdmaResource }}: {{ .rdmaResourceCount | default 1 }}
              {{- end }}
            {{- with .resources }}
            {{- if .requests }}
            requests:
              {{- toYaml .requests | nindent 14 }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - {name: agent-sock, mountPath: /var/run/daos_agent}
            {{- if not $isMP }}
            - {name: lmcache-config, mountPath: /etc/lmcache, readOnly: true}
            {{- end }}
            {{- if .model.cacheHostPath }}
            - {name: hf-cache, mountPath: /data/hf_cache}
            {{- end }}
            - {name: shm, mountPath: /dev/shm}
            {{- if and .rdma (not .rdmaResource) }}
            - {name: ib-dev, mountPath: /dev/infiniband}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health, port: {{ $port }}}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: {{ .readinessFailureThreshold | default 60 }}
      volumes:
        - name: agent-sock
          hostPath:
            path: {{ $agentDir }}
            type: Directory
        {{- if not $isMP }}
        - name: lmcache-config
          configMap: {name: {{ .name }}-lmcache}
        {{- end }}
        {{- if .model.cacheHostPath }}
        - name: hf-cache
          hostPath: {path: {{ .model.cacheHostPath }}, type: Directory}
        {{- end }}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: {{ .shmSizeLimit | default "8Gi" }}}
        {{- if and .rdma (not .rdmaResource) }}
        - name: ib-dev
          hostPath: {path: /dev/infiniband, type: Directory}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    {{- include "daos-operator.labels" $ | nindent 4 }}
spec:
  selector: {app: {{ .name }}}
  ports:
    - {name: http, port: {{ $port }}, targetPort: {{ $port }}}
---
{{- end }}
