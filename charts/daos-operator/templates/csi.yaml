{{- if .Values.csi.enabled }}
{{- $sys := .Values.csi.system | default .Values.system.name }}
{{- $ns := .Release.Namespace }}
{{- /* the node plugin mounts <system>-agent, which the operator writes into the system's namespace */}}
{{- if and .Values.system.create (eq $sys .Values.system.name) (ne (.Values.system.spec.namespace | default "daos-system") $ns) }}
{{- fail (printf "csi: the CSI node plugin reads ConfigMap %s-agent from the release namespace %q, but the operator writes it into system.spec.namespace %q. Install the release into %q (helm -n %s), or set system.spec.namespace to %q." $sys $ns (.Values.system.spec.namespace | default "daos-system") (.Values.system.spec.namespace | default "daos-system") (.Values.system.spec.namespace | default "daos-system") $ns) }}
{{- end }}
{{- $mm := .Values.csi.mountMode | default "process" }}
{{- if not (has $mm (list "process" "pod")) }}
{{- fail (printf "csi.mountMode must be process or pod, not %q" $mm) }}
{{- end }}
{{- $mp := .Values.csi.mountPod | default dict }}
{{- if and (eq $mm "pod") .Values.system.create (eq $sys .Values.system.name) (not ((.Values.system.spec.clientAgent | default dict).enabled)) }}
{{- fail "csi.mountMode pod runs dfuse in mount pods that use the node agent: enable system.spec.clientAgent (with a nodeSelector covering csi.nodeSelector)" }}
{{- end }}
{{- /* the socket dir of the DaosSystem this CSI serves: this release's own system's
     clientAgent.hostSocketDir only when csi.system is that system; another system's default
     otherwise (its custom dir goes into mountPod.agentSocketHostPath) */}}
{{- $agentDir := printf "/var/run/daos-operator/agent/%s" $sys }}
{{- if and .Values.system.create (eq $sys .Values.system.name) }}
{{- $agentDir = (.Values.system.spec.clientAgent | default dict).hostSocketDir | default $agentDir }}
{{- end }}
{{- $agentDir = $mp.agentSocketHostPath | default $agentDir }}
{{- /* daos-csi learned --mount-mode after v0.2.0: the appVersion default image would not start */}}
{{- if and (eq $mm "pod") (not .Values.csi.image.tag) (semverCompare "<0.3.0-0" (trimPrefix "v" .Chart.AppVersion)) }}
{{- fail (printf "csi.mountMode pod needs a daos-csi image with --mount-mode (daos-csi !10 or later); the default for appVersion %s does not have it: set csi.image.tag" .Chart.AppVersion) }}
{{- end }}
{{- $img := printf "%s:%s" .Values.csi.image.repository (include "daos-operator.tag" (list .Values.csi.image.tag .Chart.AppVersion "csi.image.tag")) }}
# exastor/daos-csi (deploy/ mirrored as templates). One CSI deployment per DaosSystem:
# the node DaemonSet's daos_agent sidecar reads <system>-agent, so csi.system must
# name the DaosSystem whose containers this driver mounts.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.csi.driverName }}
  labels:
    {{- include "daos-operator.labels" . | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: false
  fsGroupPolicy: None
  volumeLifecycleModes: [Persistent]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daos-csi-controller
  namespace: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daos-csi-node
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daos-csi-controller
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, watch, list, delete, update, create]
  - apiGroups: [daos.gluesys.com]
    resources: [daoscontainers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [daos.gluesys.com]
    resources: [daospools]
    verbs: [get, list, watch]
  {{- if .Values.csi.expansion.enabled }}
  # csi-resizer: PVC growth (the driver moves DaosContainer spec.spaceLimit)
  - apiGroups: [""]
    resources: [persistentvolumeclaims/status]
    verbs: [patch]
  {{- end }}
  {{- if .Values.csi.snapshots.enabled }}
  # CSI snapshots: the driver makes DaosContainerSnapshots, csi-snapshotter syncs the contents
  - apiGroups: [daos.gluesys.com]
    resources: [daoscontainersnapshots]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotclasses]
    verbs: [get, list, watch]
  # csi-provisioner: a PVC restored from a VolumeSnapshot (dataSource) reads the snapshot
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents/status]
    verbs: [update, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daos-csi-controller
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: daos-csi-controller}
subjects:
  - {kind: ServiceAccount, name: daos-csi-controller, namespace: {{ $ns }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daos-csi-node
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daos-csi-node
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: daos-csi-node}
subjects:
  - {kind: ServiceAccount, name: daos-csi-node, namespace: {{ $ns }}}
{{- if eq $mm "pod" }}
---
# mount pods (ADR-csi-002): the node plugin creates and deletes them in its own namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: daos-csi-node-mount
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: daos-csi-node-mount
  namespace: {{ $ns }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: daos-csi-node-mount}
subjects:
  - {kind: ServiceAccount, name: daos-csi-node, namespace: {{ $ns }}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daos-csi-controller
  namespace: {{ $ns }}
  labels:
    {{- include "daos-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi-controller
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: daos-csi, app.kubernetes.io/component: controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: daos-csi, app.kubernetes.io/component: controller}
    spec:
      serviceAccountName: daos-csi-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.controllerNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.controllerTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.controllerAffinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-provisioner
          image: {{ .Values.csi.sidecars.provisioner }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=$(NAMESPACE)
            - --extra-create-metadata
            - --timeout=60s
            - --retry-interval-start=2s
            - --v=2
            {{- if .Values.csi.metrics.enabled }}
            - --http-endpoint=:{{ .Values.csi.metrics.port }}
          ports:
            - {name: metrics, containerPort: {{ .Values.csi.metrics.port }}}
            {{- end }}
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          volumeMounts: [{name: socket, mountPath: /csi}]
        {{- if .Values.csi.snapshots.enabled }}
        - name: csi-snapshotter
          image: {{ .Values.csi.sidecars.snapshotter }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=$(NAMESPACE)
            - --timeout=60s
            - --v=2
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          volumeMounts: [{name: socket, mountPath: /csi}]
        {{- end }}
        {{- if .Values.csi.expansion.enabled }}
        - name: csi-resizer
          image: {{ .Values.csi.sidecars.resizer }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace=$(NAMESPACE)
            - --timeout=60s
            - --handle-volume-inuse-error=false
            - --v=2
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          volumeMounts: [{name: socket, mountPath: /csi}]
        {{- end }}
        - name: daos-csi
          image: {{ $img }}
          imagePullPolicy: {{ .Values.csi.image.pullPolicy }}
          args: ["--mode=controller", "--endpoint=unix:///csi/csi.sock", "--namespace=$(NAMESPACE)", "--driver-name={{ .Values.csi.driverName }}", "--v=2"]
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          volumeMounts: [{name: socket, mountPath: /csi}]
          resources:
            {{- toYaml .Values.csi.controllerResources | nindent 12 }}
      volumes:
        - {name: socket, emptyDir: {}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daos-csi-node
  namespace: {{ $ns }}
  labels:
    {{- include "daos-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: csi-node
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: daos-csi, app.kubernetes.io/component: node}
  updateStrategy:
    {{- /* an upgrade with --reuse-values keeps the old release's values, which have no nodeUpdateStrategy */}}
    {{- $us := .Values.csi.nodeUpdateStrategy | default dict }}
    {{- /* only a missing key means RollingUpdate; an explicit "" (an empty substitution) is refused below */}}
    {{- $ut := "RollingUpdate" }}
    {{- if hasKey $us "type" }}{{- $ut = $us.type }}{{- end }}
    {{- if not (has $ut (list "RollingUpdate" "OnDelete")) }}
    {{- fail (printf "csi.nodeUpdateStrategy.type must be RollingUpdate or OnDelete, not %q" $ut) }}
    {{- end }}
    {{- if eq $ut "OnDelete" }}
    type: OnDelete
    {{- else }}
    type: RollingUpdate
    {{- /* hasKey, not default: maxUnavailable 0 (with maxSurge) is a valid choice */}}
    {{- $ru := deepCopy ($us.rollingUpdate | default dict) }}
    {{- if not (hasKey $ru "maxUnavailable") }}{{- $_ := set $ru "maxUnavailable" 1 }}{{- end }}
    rollingUpdate:
      {{- toYaml $ru | nindent 6 }}
    {{- end }}
  template:
    metadata:
      labels: {app.kubernetes.io/name: daos-csi, app.kubernetes.io/component: node}
    spec:
      serviceAccountName: daos-csi-node
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      shareProcessNamespace: true
      priorityClassName: system-node-critical
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.csi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.csi.tolerations | nindent 8 }}
      {{- if eq $mm "process" }}
      # dfuse runs in this pod and asks this agent; in pod mode the mount pods use the node agent
      initContainers:
        - name: agent
          image: {{ .Values.csi.agentImage | default .Values.system.spec.images.agent }}
          restartPolicy: Always
          # the agent enumerates the fabric (ib0 -> mlx5_0) to answer GetAttachInfo
          securityContext: {privileged: true}
          volumeMounts:
            - {name: agentcfg, mountPath: /etc/daos/daos_agent.yml, subPath: daos_agent.yml, readOnly: true}
            - {name: agentsock, mountPath: /var/run/daos_agent}
            - {name: dev, mountPath: /dev}
            {{- if .Values.csi.tls }}
            - {name: certs-agent, mountPath: /etc/daos/certs, readOnly: true}
            {{- end }}
      {{- end }}
      containers:
        - name: registrar
          image: {{ .Values.csi.sidecars.registrar }}
          args: ["--csi-address=/csi/csi.sock", "--kubelet-registration-path={{ .Values.csi.kubeletDir }}/plugins/{{ .Values.csi.driverName }}/csi.sock", "--v=2"]
          volumeMounts:
            - {name: socket, mountPath: /csi}
            - {name: registration, mountPath: /registration}
        - name: daos-csi
          image: {{ $img }}
          imagePullPolicy: {{ .Values.csi.image.pullPolicy }}
          args: ["--mode=node", "--endpoint=unix:///csi/csi.sock", "--node-id=$(NODE_ID)", "--staging-dir=/var/lib/daos-csi", "--kubelet-dir={{ .Values.csi.kubeletDir }}", "--driver-name={{ .Values.csi.driverName }}", "--v=2"
            {{- $dfuse := .Values.csi.dfuseArgs | default list }}
            {{- if .Values.csi.multiUser }}{{ $dfuse = prepend $dfuse "--multi-user" | uniq }}{{ end }}
            {{- with $dfuse }}, {{ printf "--dfuse-args=%s" (join "," .) | quote }}{{ end }}
            {{- if eq $mm "pod" }}, "--mount-mode=pod", "--mount-namespace={{ $ns }}", {{ printf "--mount-image=%s" ($mp.image | default .Values.system.spec.images.client) | quote }}, {{ printf "--mount-agent-dir=%s" $agentDir | quote }}, {{ printf "--mount-priority-class=%s" ($mp.priorityClassName | default "system-node-critical") | quote }}
            {{- with $mp.memory }}, {{ printf "--mount-memory=%s" . | quote }}{{ end }}
            {{- with .Values.imagePullSecrets }}{{ $names := list }}{{ range . }}{{ $names = append $names (.name | default .) }}{{ end }}, {{ printf "--mount-pull-secrets=%s" (join "," $names) | quote }}{{ end }}
            {{- end }}]
          env:
            - name: NODE_ID
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            {{- if eq $mm "process" }}
            - {name: DAOS_AGENT_DRPC_DIR, value: /var/run/daos_agent}
            {{- end }}
          securityContext: {privileged: true}
          volumeMounts:
            - {name: socket, mountPath: /csi}
            {{- if eq $mm "process" }}
            - {name: agentsock, mountPath: /var/run/daos_agent}
            {{- end }}
            - {name: kubelet, mountPath: {{ .Values.csi.kubeletDir }}, mountPropagation: Bidirectional}
            - {name: staging, mountPath: /var/lib/daos-csi, mountPropagation: Bidirectional}
            - {name: dev, mountPath: /dev}
            {{- if .Values.csi.tls }}
            - {name: certs-admin, mountPath: /etc/daos/certs, readOnly: true}
            {{- end }}
          resources:
            {{- toYaml .Values.csi.nodeResources | nindent 12 }}
      volumes:
        - {name: socket, hostPath: {path: {{ .Values.csi.kubeletDir }}/plugins/{{ .Values.csi.driverName }}, type: DirectoryOrCreate}}
        - {name: registration, hostPath: {path: {{ .Values.csi.kubeletDir }}/plugins_registry, type: Directory}}
        - {name: kubelet, hostPath: {path: {{ .Values.csi.kubeletDir }}, type: Directory}}
        - {name: staging, hostPath: {path: /var/lib/daos-csi, type: DirectoryOrCreate}}
        - {name: dev, hostPath: {path: /dev, type: Directory}}
        - {name: agentsock, emptyDir: {}}
        - name: agentcfg
          configMap: {name: {{ $sys }}-agent}
        {{- if .Values.csi.tls }}
        - name: certs-agent
          secret:
            secretName: {{ $sys }}-certs
            defaultMode: 0444
            items:
              - {key: daosCA.crt, path: daosCA.crt}
              - {key: agent.crt, path: agent.crt}
              - {key: agent.key, path: agent.key, mode: 0400}
        - name: certs-admin
          secret:
            secretName: {{ $sys }}-certs
            defaultMode: 0444
            items:
              - {key: daosCA.crt, path: daosCA.crt}
              - {key: admin.crt, path: admin.crt}
              - {key: admin.key, path: admin.key, mode: 0400}
        {{- end }}
{{- if and .Values.csi.snapshots.enabled .Values.csi.snapshots.volumeSnapshotClass.create }}
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .Values.csi.snapshots.volumeSnapshotClass.name }}
  labels:
    {{- include "daos-operator.labels" . | nindent 4 }}
  {{- if .Values.csi.snapshots.volumeSnapshotClass.default }}
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
  {{- end }}
driver: {{ .Values.csi.driverName }}
deletionPolicy: {{ .Values.csi.snapshots.volumeSnapshotClass.deletionPolicy }}
{{- end }}
{{- range .Values.csi.storageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "daos-operator.labels" $ | nindent 4 }}
provisioner: {{ $.Values.csi.driverName }}
reclaimPolicy: {{ .reclaimPolicy | default "Delete" }}
volumeBindingMode: Immediate
allowVolumeExpansion: {{ $.Values.csi.expansion.enabled }}
parameters:
  {{- toYaml .parameters | nindent 2 }}
{{- end }}
{{- end }}
