---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: daospools.daos.gluesys.com
spec:
  group: daos.gluesys.com
  names:
    kind: DaosPool
    listKind: DaosPoolList
    plural: daospools
    shortNames:
    - daospool
    singular: daospool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.systemRef
      name: System
      type: string
    - jsonPath: .spec.size
      name: Size
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.usedPercent
      name: Used%
      type: integer
    - jsonPath: .status.rebuildState
      name: Rebuild
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DaosPool is a DAOS pool.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DaosPoolSpec maps to `dmg pool create`.
            properties:
              acl:
                description: ACL entries in DAOS ACE syntax (A::user@:rw). Declarative.
                items:
                  type: string
                type: array
              properties:
                additionalProperties:
                  type: string
                description: Properties are extra `--properties k:v` pairs (e.g. ec_cell_sz).
                type: object
              ranks:
                description: |-
                  Ranks restricts the pool to these ranks; empty = all. Appending ranks
                  triggers `dmg pool extend`.
                items:
                  format: int32
                  type: integer
                type: array
              redundancyFactor:
                description: |-
                  RedundancyFactor is rd_fac. Unset means 2; 0 is valid and means "no
                  redundancy", which is what a pool on a single fault domain needs. It is a
                  pointer because with a default an omitted 0 would come back as the default.
                format: int32
                maximum: 4
                minimum: 0
                type: integer
              size:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Size is the total pool size (dmg pool create --size). Extension is done
                  by adding ranks, not by editing Size (DAOS 2.8 has no shrink).
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              spaceWarningPercent:
                description: |-
                  SpaceWarningPercent is where the SpaceLow condition flips to True.
                  DAOS enforces capacity per pool, so this is the number that matters for
                  every container and PV in it. Unset means 85; 0 disables the check
                  (a pointer, because with a default an omitted 0 would be indistinguishable).
                format: int32
                maximum: 100
                minimum: 0
                type: integer
              systemRef:
                description: SystemRef names the DaosSystem this pool lives in.
                type: string
            required:
            - size
            - systemRef
            type: object
          status:
            description: |-
              DaosPoolStatus mirrors `dmg pool query`. Nothing here is a second source of
              truth: every field is copied from dmg output.
            properties:
              appliedACLHash:
                description: AppliedACLHash identifies the spec.acl last written with
                  overwrite-acl.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              disabledTargets:
                format: int32
                type: integer
              enabledRanks:
                description: EnabledRanks are the ranks the pool spans (dmg pool query
                  --show-enabled).
                items:
                  format: int32
                  type: integer
                type: array
              freeBytes:
                format: int64
                type: integer
              label:
                type: string
              lastQueryTime:
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the last create attempt was made for;
                  a failed create is not retried until the spec changes.
                format: int64
                type: integer
              operation:
                description: Operation is the dmg Job in flight (create, extend, acl,
                  destroy); empty when idle.
                type: string
              rebuildState:
                type: string
              state:
                type: string
              totalBytes:
                format: int64
                type: integer
              usedPercent:
                description: UsedPercent is (total-free)/total from the last query,
                  rounded down.
                format: int32
                type: integer
              uuid:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
