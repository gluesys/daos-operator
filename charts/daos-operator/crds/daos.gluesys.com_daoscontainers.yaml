---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: daoscontainers.daos.gluesys.com
spec:
  group: daos.gluesys.com
  names:
    kind: DaosContainer
    listKind: DaosContainerList
    plural: daoscontainers
    shortNames:
    - daoscont
    singular: daoscontainer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef
      name: Pool
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.health
      name: Health
      type: string
    - jsonPath: .spec.spaceLimit
      name: Limit
      priority: 1
      type: string
    - jsonPath: .status.spaceUsedBytes
      name: Used
      priority: 1
      type: integer
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DaosContainer is a DAOS container; the CSI controller creates
          one per PV.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DaosContainerSpec maps to `daos cont create`. Defaults come from the
              lmcache-daos measurements (chunk 4 MiB, RP_2GX); the CSI StorageClass
              parameters are passed through here.

              RP_2GX / RP_2G1 place two replicas in two fault domains (= two server
              nodes). On a single-node system `daos cont create` fails with
              "grp size (2) is larger than domain nr (1)" (seen on the FlexA test bed,
              2026-09-15): use fileOclass SX / dirOclass S1 and redundancyFactor 0 there.
            properties:
              acl:
                items:
                  type: string
                type: array
              checksum:
                default: crc32
                description: Checksum type (2.8 default crc32). "off" disables.
                type: string
              chunkSize:
                default: 4194304
                description: ChunkSize in bytes (DFS chunk). 4194304 measured best
                  for KV chunks.
                format: int64
                type: integer
              dirOclass:
                default: RP_2G1
                type: string
              fileOclass:
                default: RP_2GX
                type: string
              label:
                description: Label is the DAOS container label; defaults to metadata.name.
                type: string
              poolRef:
                type: string
              properties:
                additionalProperties:
                  type: string
                type: object
              redundancyFactor:
                description: RedundancyFactor overrides the pool's rd_fac when set.
                format: int32
                type: integer
              restoreFrom:
                description: |-
                  RestoreFrom fills the new container with the contents of a snapshot: a
                  writable copy, since DAOS 2.8 cannot roll a container back. After
                  `daos cont create` a Job mounts the snapshot read-only (dfuse
                  --snap-epoch), mounts this container and copies with `cp -a`; the container
                  is Ready only once the copy finished. POSIX containers only. Set it at
                  creation; it cannot change afterwards.
                properties:
                  deadlineSeconds:
                    default: 86400
                    description: DeadlineSeconds bounds one copy attempt (the Job's
                      activeDeadlineSeconds).
                    format: int64
                    minimum: 300
                    type: integer
                  snapshotRef:
                    description: |-
                      SnapshotRef is a DaosContainerSnapshot in this namespace. The copy waits
                      until it was taken; an approved destroy of it waits for the copy.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: snapshotRef is immutable
                      rule: self == oldSelf
                required:
                - snapshotRef
                type: object
              spaceLimit:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  SpaceLimit is a hard quota on the container's logical data (DAOS
                  property space_limit). Only the exastor extended edition of DAOS has it:
                  the operator detects the edition from `daos cont query` and sets the
                  property after the container exists; on upstream DAOS the field is
                  reported as unsupported (condition SpaceLimit) and nothing else changes.
                  It can be raised, lowered or removed (unlimited) later. For an EC file
                  object class the storage amplification (space_amp) is set with it.
                  Must be positive; remove the field for no limit.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: spaceLimit must be positive; remove the field for no limit
                  rule: quantity(string(self)).isGreaterThan(quantity('0'))
              type:
                default: POSIX
                description: ContainerType is the DAOS container layout.
                enum:
                - POSIX
                - PYTHON
                - HDF5
                - UNKNOWN
                type: string
            required:
            - poolRef
            type: object
            x-kubernetes-validations:
            - message: restoreFrom cannot be added or removed after creation
              rule: has(self.restoreFrom) == has(oldSelf.restoreFrom)
          status:
            description: DaosContainerStatus mirrors `daos cont query`.
            properties:
              appliedACLHash:
                type: string
              appliedSpaceLimit:
                description: |-
                  AppliedSpaceLimit is the space_limit the operator last set (bytes, 0 =
                  unlimited); unset when it never set one.
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              edition:
                description: |-
                  Edition is what `daos cont query` says about the DAOS build: "extended"
                  (exastor, reports space usage and takes space_limit) or "upstream".
                type: string
              health:
                type: string
              lastQueryTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              operation:
                description: Operation is the daos Job in flight (create, acl, quota,
                  restore, destroy); empty when idle.
                type: string
              poolUUID:
                type: string
              ready:
                type: boolean
              requestedSpaceLimit:
                description: |-
                  RequestedSpaceLimit is the space_limit the last set-prop Job was started
                  with; what it applied is recorded from this, not from a spec that changed
                  while it ran.
                format: int64
                type: integer
              restoreFailedAt:
                description: |-
                  RestoreFailedAt is when the last copy attempt failed; it is retried a while
                  after that (the copy overwrites, so a retry is safe).
                format: date-time
                type: string
              restoreSource:
                description: |-
                  RestoreSource is the snapshot the last copy attempt reads, as it was when
                  the attempt started: a snapshot deleted and re-created under the same name
                  meanwhile is not mistaken for it.
                properties:
                  containerUUID:
                    type: string
                  epoch:
                    description: Epoch, PoolUUID and ContainerUUID are what dfuse
                      mounts.
                    type: string
                  poolUUID:
                    type: string
                  snapshot:
                    description: Snapshot is the DaosContainerSnapshot name, SnapshotUID
                      its UID.
                    type: string
                  snapshotUID:
                    type: string
                required:
                - containerUUID
                - epoch
                - poolUUID
                - snapshot
                - snapshotUID
                type: object
              restoreStartedAt:
                description: RestoreStartedAt is when the last copy attempt started.
                format: date-time
                type: string
              restoredFrom:
                description: RestoredFrom is "<snapshot>@<epoch>" once spec.restoreFrom
                  was copied in.
                type: string
              spaceUsedBytes:
                description: |-
                  SpaceUsedBytes is the container's logical data as the extended edition
                  accounts it against spaceLimit.
                format: int64
                type: integer
              type:
                type: string
              uuid:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
