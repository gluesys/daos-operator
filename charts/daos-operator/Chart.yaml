apiVersion: v2
name: daos-operator
description: DAOS on Kubernetes - operator (DaosSystem/DaosPool/DaosContainer), host preparation, telemetry, Grafana dashboard
type: application
version: 0.1.3
appVersion: "v0.1.0-rc.4"
# native sidecars (initContainers[].restartPolicy) for the daos_agent in DaosContainer Jobs
kubeVersion: ">=1.29.0-0"
home: https://gitlab.gluesys.com/exastor/daos-operator
sources:
  - https://gitlab.gluesys.com/exastor/daos-operator
  - https://gitlab.gluesys.com/exastor/daos-images
keywords: [daos, storage, nvme, rdma, kv-cache]
maintainers:
  - name: Gluesys exastor
annotations:
  daos.gluesys.com/daos-version: "2.8.0"
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "true"
  artifacthub.io/crds: |
    - kind: DaosSystem
      version: v1alpha1
      name: daossystems.daos.gluesys.com
      displayName: DAOS system
      description: The engines - node selection, fabric, storage tiers, management-service replicas
    - kind: DaosPool
      version: v1alpha1
      name: daospools.daos.gluesys.com
      displayName: DAOS pool
      description: A pool, its redundancy factor, rank set and space warnings
    - kind: DaosContainer
      version: v1alpha1
      name: daoscontainers.daos.gluesys.com
      displayName: DAOS container
      description: A container in a pool, POSIX or unstructured
    - kind: S3Service
      version: v1alpha1
      name: s3services.daos.gluesys.com
      displayName: S3 gateway
      description: A versitygw gateway serving one pool over S3
