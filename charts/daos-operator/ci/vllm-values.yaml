# Tier 0 render profile (hack/ci/chart-schema.sh). Not a deployment recipe.
system:
  create: true
  name: daos
  spec:
    version: "2.8.0"
    namespace: daos-system
    images:
      server: registry.gitlab.gluesys.com/exastor/daos-images/daos-server:2.8.0-20260922
      agent: registry.gitlab.gluesys.com/exastor/daos-images/daos-agent:2.8.0-20260914
      admin: registry.gitlab.gluesys.com/exastor/daos-images/daos-admin:2.8.0-20260914
      client: registry.gitlab.gluesys.com/exastor/daos-images/daos-client:2.8.0-20260914
    placement: dedicated
    nodeSelector: {daos.gluesys.com/role: storage}
    msReplicas: 1
    provider: "ofi+verbs;ofi_rxm"
    nrHugepages: 4096
    allowInsecure: true
    engines:
      - {targets: 4, helpers: 0, bdevClass: kdev, scmSizeGiB: 4}
vllm:
  services:
    - name: vllm-daos
      image: registry.gitlab.gluesys.com/exastor/daos-images/vllm-lmcache-daos:0.30.0-0.5.5-20261028
      poolRef: podpool
      containerRef: kvlmc
      model: {path: /data/hf_cache/model, servedName: test, cacheHostPath: /mnt/hf_cache}
      port: 8100
      gpus: 1
      rdma: true
      nodeSelector: {nvidia.com/gpu.present: "true"}
      rankGuard: {enabled: true, oclass: S1, capacityGB: 3, spacePoll: 0, evictAt: 0.25, eviction: lru}
      lmcacheCpuGB: 0
    - name: vllm-daos-rbln
      image: registry.example.com/vllm-rbln-lmcache-daos:test
      accelerator: rbln
      acceleratorCount: 1
      poolRef: podpool
      containerRef: kvlmc
      model: {path: /data/hf_cache/model, servedName: test-rbln, cacheHostPath: /mnt/hf_cache}
      port: 8101
      rdma: true
    - name: vllm-daos-mp
      image: registry.gitlab.gluesys.com/exastor/daos-images/vllm-lmcache-daos:0.30.0-0.5.5-20261028
      lmcacheMode: mp
      poolRef: kvc
      containerRef: kvdfs
      systemName: daos_moon
      lmcacheChunkSize: 784
      mp: {l1SizeGB: 14, l2StorePolicy: skip_l1, workers: 16, maxCapacityGB: 600}
      shmSizeLimit: 16Gi
      model: {path: /data/hf_cache/model, servedName: test-mp, cacheHostPath: /mnt/hf_cache}
      port: 8102
      rdma: true
      extraArgs: [--enable-prefix-caching, --mamba-cache-mode=align, --attention-backend=TRITON_ATTN, --kv-cache-dtype=bfloat16]
