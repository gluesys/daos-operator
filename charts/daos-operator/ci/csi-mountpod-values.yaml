# Tier 0 render profile (hack/ci/chart-schema.sh). Not a deployment recipe.
# csi-values.yaml with dfuse in mount pods (csi.mountMode pod, daos-csi ADR-csi-002).
system:
  create: true
  name: daos
  spec:
    version: "2.8.0"
    namespace: daos-system
    images:
      server: registry.gitlab.gluesys.com/exastor/daos-images/daos-server:2.8.0-20260922
      agent: registry.gitlab.gluesys.com/exastor/daos-images/daos-agent:2.8.0-20260914
      admin: registry.gitlab.gluesys.com/exastor/daos-images/daos-admin:2.8.0-20260914
      client: registry.gitlab.gluesys.com/exastor/daos-images/daos-client:2.8.0-20260914
    placement: dedicated
    nodeSelector: {daos.gluesys.com/role: storage}
    msReplicas: 1
    provider: "ofi+tcp"
    nrHugepages: 4096
    allowInsecure: true
    engines:
      - {targets: 4, helpers: 0, bdevClass: kdev, scmSizeGiB: 4}
    clientAgent: {enabled: true, nodeSelector: {daos.gluesys.com/client-agent: "true"}}
csi:
  enabled: true
  snapshots: {enabled: true}   # csi-snapshotter sidecar, snapshot RBAC, VolumeSnapshotClass
  expansion: {enabled: true}   # csi-resizer sidecar, allowVolumeExpansion
  multiUser: true              # dfuse --multi-user (account-UID pods, rootUID)
  dfuseArgs: [--disable-caching, --eq-count=2]
  mountMode: pod
  mountPod: {priorityClassName: system-node-critical}
  nodeUpdateStrategy: {type: OnDelete}
  controllerNodeSelector: {daos.gluesys.com/role: storage}
  controllerTolerations: [{key: dedicated, operator: Equal, value: daos, effect: NoSchedule}]
  storageClasses:
    - name: daos-kv
      reclaimPolicy: Delete
      parameters: {pool: kv, oclass: RP_2GX, dirOclass: RP_2G1, chunkSize: "4194304", csum: crc32}
    - name: daos-kv-user
      reclaimPolicy: Delete
      parameters: {pool: kv, rootUID: "1001", rootGID: "1001", rootMode: "0770", rootOwnerFromPVC: "true"}
