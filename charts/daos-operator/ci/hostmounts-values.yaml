# Tier 0 render profile (hack/ci/chart-schema.sh). Not a deployment recipe.
system:
  create: true
  name: daos
  spec:
    version: "2.8.0"
    namespace: daos-system
    systemName: daos_k8s
    images:
      server: registry.gitlab.gluesys.com/exastor/daos-images/daos-server:2.8.0-20260922
      agent: registry.gitlab.gluesys.com/exastor/daos-images/daos-agent:2.8.0-20260914
      admin: registry.gitlab.gluesys.com/exastor/daos-images/daos-admin:2.8.0-20260914
      client: registry.gitlab.gluesys.com/exastor/daos-images/daos-client:2.8.0-20260914
    placement: dedicated
    nodeSelector: {daos.gluesys.com/role: storage}
    msReplicas: 1
    provider: "ofi+verbs;ofi_rxm"
    nrHugepages: 4096
    allowInsecure: true
    engines:
      - {targets: 4, helpers: 0, bdevClass: kdev, scmSizeGiB: 4}
    clientAgent:
      enabled: true
      nodeSelector: {daos.gluesys.com/client: "true"}
hostMounts:
  - name: vfroot
    pool: bai
    container: vfroot
    hostPath: /vfroot/daos
    nodeSelector: {daos.gluesys.com/client: "true"}
  - name: scratch
    pool: bai
    container: scratch
    hostPath: /mnt/daos/scratch/
    multiUser: false
    dfuseArgs: [--thread-count=16, --eq-count=4, --disable-caching]
    updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1}}
    tolerations: [{operator: Exists}]
    resources: {requests: {cpu: "1", memory: 1Gi}, limits: {memory: 8Gi}}
    extraEnv: [{name: D_LOG_MASK, value: WARN}]
