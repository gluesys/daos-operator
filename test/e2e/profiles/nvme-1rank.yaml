# Tier 1 프로파일: 워커 1대(exaci5-3a), SPDK nvme 클래스, QEMU NVMe + uio_pci_generic(vIOMMU 없음).
# 설계 doc/ci-design-2026-10-02.md 5절.
image:
  repository: registry.gitlab.gluesys.com/exastor/daos-operator/daos-operator
  tag: latest
imagePullSecrets:
  - name: gitlab-registry
hostprep:
  defaultImage: registry.gitlab.gluesys.com/exastor/daos-operator/daos-hostprep:latest
system:
  create: true
  name: daos
  spec:
    version: "2.8.0"
    namespace: daos-system
    images:
      server: registry.gitlab.gluesys.com/exastor/daos-images/daos-server:2.8.0-20260922
      agent:  registry.gitlab.gluesys.com/exastor/daos-images/daos-agent:2.8.0-20260914
      admin:  registry.gitlab.gluesys.com/exastor/daos-images/daos-admin:2.8.0-20260914
      client: registry.gitlab.gluesys.com/exastor/daos-images/daos-client:2.8.0-20260914
    placement: dedicated
    nodeSelector:
      kubernetes.io/hostname: exaci5-3a
    msReplicas: 1
    provider: "ofi+tcp"
    nrHugepages: 2048
    allowInsecure: true
    disableVFIO: true
    systemRamReservedGiB: 8
    engines:
      - targets: 4
        helpers: 0
        fabricIface: ens19
        bdevClass: nvme
        bdevList: []            # hostprep 이 uio_pci_generic 으로 묶은 QEMU NVMe 를 발견한다
        scmSizeGiB: 4
    hostPrep:
      enabled: true
      bindNvme: true
