# Tier 1 프로파일: 워커 1대(exaci5-3a), SPDK nvme 클래스, QEMU NVMe + uio_pci_generic(vIOMMU 없음).
# 설계 doc/ci-design-2026-10-02.md 5절.
image:
  repository: registry.gitlab.gluesys.com/exastor/daos-operator/daos-operator
  tag: "65bcaee5"
imagePullSecrets:
  - name: gitlab-registry
hostprep:
  defaultImage: registry.gitlab.gluesys.com/exastor/daos-operator/daos-hostprep:65bcaee5
system:
  create: true
  name: daos
  spec:
    version: "2.8.0"
    namespace: daos-system
    images:
      server: registry.gitlab.gluesys.com/exastor/daos-images/daos-server:2.8.0-20261110-gc1645462
      agent:  registry.gitlab.gluesys.com/exastor/daos-images/daos-agent:2.8.0-20261110-gc1645462
      admin:  registry.gitlab.gluesys.com/exastor/daos-images/daos-admin:2.8.0-20261110-gc1645462
      client: registry.gitlab.gluesys.com/exastor/daos-images/daos-client:2.8.0-20261110-gc1645462
    placement: dedicated
    nodeSelector:
      kubernetes.io/hostname: exaci5-3a
    msReplicas: 1
    provider: "ofi+tcp"
    nrHugepages: 2048
    allowInsecure: true
    disableVFIO: true
    systemRamReservedGiB: 8
    engines:
      - targets: 4
        helpers: 0
        fabricIface: ens19
        bdevClass: nvme
        bdevList: []            # hostprep 이 uio_pci_generic 으로 묶은 QEMU NVMe 를 발견한다
        scmSizeGiB: 4
    hostPrep:
      enabled: true
      bindNvme: true
# CSI for the data-path case (Tier 1 case 2). One rank: SX/S1, rdFac 0 (RP_2* needs two).
csi:
  enabled: true
  image:
    repository: registry.gitlab.gluesys.com/exastor/daos-csi/daos-csi
    tag: edcacf9e  # main with mount pods (csi!10), for case 16; volume root owner (csi!7)
  # dfuse --multi-user: account-UID pods may use the mount (FUSE allow_other) and the root
  # owner can be set; case 15 runs pods as UID 1001, as KISTI's 6th supercomputer does
  multiUser: true
  expansion: {enabled: true}
  snapshots: {enabled: true}  # VolumeSnapshot: the suite installs the CRDs and snapshot-controller
  storageClasses:
    - name: daos-e2e
      reclaimPolicy: Delete
      parameters: {pool: e2epool, oclass: SX, dirOclass: S1, rdFac: "0", chunkSize: "4194304", csum: crc32}
    - name: daos-e2e-owner  # case 15: the volume root belongs to UID 1001 (csi!7)
      reclaimPolicy: Delete
      parameters: {pool: e2epool, oclass: SX, dirOclass: S1, rdFac: "0", rootUID: "1001", rootGID: "1001", rootMode: "2770"}
# Tier 1 case 15: the interception webhook (it only touches annotated pods outside the release namespace).
interception:
  enabled: true
