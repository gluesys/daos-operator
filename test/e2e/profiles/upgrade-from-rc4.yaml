# 케이스 6 의 '출발' 값: v0.1.0-rc.4 차트(git 태그)로 설치한다. operator·CSI 는 차트 기본(ghcr rc.4),
# hostprep 은 ghcr 에 rc.4 이미지가 없어(설계 13절 #15) GitLab 의 rc.4 빌드(b38a5b86). DAOS 이미지는
# 목표와 같게 두어 operator·CSI·차트만 바뀌게 한다.
# 설계 doc/ci-design-2026-10-02.md 5절.
imagePullSecrets:
  - name: gitlab-registry
hostprep:
  defaultImage: registry.gitlab.gluesys.com/exastor/daos-operator/daos-hostprep:b38a5b86
system:
  create: true
  name: daos
  spec:
    version: "2.8.0"
    namespace: daos-system
    images:
      server: registry.gitlab.gluesys.com/exastor/daos-images/daos-server:2.8.0-20261006-g41c3647d
      agent:  registry.gitlab.gluesys.com/exastor/daos-images/daos-agent:2.8.0-20261006-g41c3647d
      admin:  registry.gitlab.gluesys.com/exastor/daos-images/daos-admin:2.8.0-20261006-g41c3647d
      client: registry.gitlab.gluesys.com/exastor/daos-images/daos-client:2.8.0-20261006-g41c3647d
    placement: dedicated
    nodeSelector:
      kubernetes.io/hostname: exaci5-3a
    msReplicas: 1
    provider: "ofi+tcp"
    nrHugepages: 2048
    allowInsecure: true
    systemRamReservedGiB: 8
    engines:
      - targets: 4
        helpers: 0
        fabricIface: ens19
        bdevClass: kdev
        bdevList: [/dev/sdb]
        scmSizeGiB: 4
    hostPrep:
      enabled: true
      bindNvme: false
# CSI for the data-path case (Tier 1 case 2). One rank: SX/S1, rdFac 0 (RP_2* needs two).
csi:
  enabled: true
  storageClasses:
    - name: daos-e2e
      reclaimPolicy: Delete
      parameters: {pool: e2epool, oclass: SX, dirOclass: S1, rdFac: "0", chunkSize: "4194304", csum: crc32}
