  name: s3services.daos.gluesys.com
spec:
  group: daos.gluesys.com
  names:
    kind: S3Service
    listKind: S3ServiceList
    plural: s3services
    shortNames:
    - s3svc
    singular: s3service
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
