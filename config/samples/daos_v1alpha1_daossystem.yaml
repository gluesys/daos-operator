apiVersion: daos.gluesys.com/v1alpha1
kind: DaosSystem
metadata:
  name: daos-dev
spec:
  version: "2.8.0"
  images:
    server: registry.gitlab.gluesys.com/exastor/daos-images/daos-server:2.8.0-20260914
    agent:  registry.gitlab.gluesys.com/exastor/daos-images/daos-agent:2.8.0-20260914
    admin:  registry.gitlab.gluesys.com/exastor/daos-images/daos-admin:2.8.0-20260914
  placement: dedicated
  nodeSelector:
    daos.gluesys.com/role: storage
  msReplicas: 1            # Phase 0 test bed has two hosts; not HA (ADR-001)
  provider: "ofi+verbs;ofi_rxm"
  nrHugepages: 8192
  allowInsecure: true      # Phase 0 only
  engines:
    - targets: 8
      helpers: 2
      fabricIface: ""      # empty = discover per node (ens2 vs ens2np0)
      bdevList: []         # empty = discover VFIO-bound NVMe per node
      scmSizeGiB: 32
