# Copyright 2026 Gluesys Co., Ltd.
#
# check: everything that runs without a DAOS or Kubernetes cluster.
# image: operator + hostprep container images, built with podman on the
#        exa-build runner (tag daos-build) and pushed to the project registry
#        as :<short sha>, :<VERSION> and :latest on main.
# Do not add a job that silently skips when its prerequisites are missing.
stages: [check, image, e2e, release]

default:
  image: python:3.12-slim
  tags: [Flexa]
  interruptible: true

variables:
  GIT_DEPTH: "20"
  # daos-images 의 CI 가 한 태그로 빌드한 역할 이미지(daos-images !2). render-validate 와 CI 클러스터가 쓴다.
  # 20261006: libfabric 을 DAOS 저장소 1.22.0 으로 고정(daos-images !3, 설계 13절 #24).
  DAOS_IMAGE_TAG: 2.8.0-20261006-g41c3647d

syntax:
  stage: check
  script:
    - find . -path ./.git -prune -o -name '*.sh' -print | xargs -r -n1 bash -n
    - find . -path ./.git -prune -o -name '*.py' -print | xargs -r -n50 python3 -m py_compile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

license-headers:
  stage: check
  script:
    - test -f LICENSE && test -f NOTICE
    - |
      sources=$(find . -path ./.git -prune -o -path ./third_party -prune -o \
        \( -name '*.py' -o -name '*.sh' -o -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.go' -o -name 'Dockerfile*' \) -print)
      missing=$(for f in $sources; do
          head -5 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0' || echo "$f";
        done)
      if [ -n "$missing" ]; then echo "SPDX header missing in:"; echo "$missing"; exit 1; fi
      echo "SPDX headers present in all $(echo "$sources" | wc -w) sources"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Go: build + vet + unit tests without envtest binaries (controller tests that
# need envtest run in Phase 2 on a runner with setup-envtest).
go-build:
  stage: check
  image: golang:1.26
  variables:
    GOTOOLCHAIN: auto   # go.mod pins go 1.26.0; let go fetch the exact toolchain if the image lags
    GOFLAGS: -buildvcs=false
  script:
    - go build ./...
    - go vet ./...
    - gofmt -l api/ internal/ cmd/ | tee /tmp/gofmt.txt; test ! -s /tmp/gofmt.txt
    - make manifests generate && git diff --exit-code -- config/crd api/
    - make helm-sync && git diff --exit-code -- charts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Tier 0 (doc/ci-design-2026-10-02.md): unit + envtest. go-build above deliberately skips envtest.
go-test:
  stage: check
  image: golang:1.26
  variables:
    GOTOOLCHAIN: auto
    GOFLAGS: -buildvcs=false
  script:
    - make test
    - go tool cover -func=cover.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths: [cover.out]
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Tier 0: every chart profile (charts/daos-operator/ci/) against K8s 1.29/1.31/1.34 schemas,
# custom resources included (schemas extracted from the chart's CRDs).
chart-schema:
  stage: check
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  script:
    - apk add --no-cache -q bash python3 py3-yaml curl
    - curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
    - hack/ci/chart-schema.sh
  artifacts:
    when: on_failure
    paths: [dist/chart-schema/]
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Tier 0: the configurations the operator renders, checked by the real DAOS 2.8 binaries
# (exastor/daos-images scripts/validate-config.sh). Render needs Go, validation needs podman.
render:
  stage: check
  image: golang:1.26
  variables:
    GOTOOLCHAIN: auto
    GOFLAGS: -buildvcs=false
  script:
    - go run ./hack/render-samples -out dist/render
  artifacts:
    paths: [dist/render/]
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# DAOS 2.8 binaries need AVX2: exa-build (daos-build) has none and dies with SIGILL. 3J (daos-k8s,
# Xeon 6330) runs them; gitlab-runner may `sudo podman` there (/etc/sudoers.d/gitlab-runner-podman).
# No resource_group: it does not touch the e2e cluster, and 3J runs two jobs at once.
render-validate:
  stage: check
  tags: [daos-k8s]
  needs: [render]
  script:
    - export REG="${CI_REGISTRY%%:*}"
    - echo "$CI_JOB_TOKEN" | sudo podman login --username gitlab-ci-token --password-stdin "$REG"
    # job token allowlist: daos-images permits daos-operator (2026-10-03)
    - git clone -q --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/exastor/daos-images.git" /tmp/daos-images-$CI_JOB_ID
    - RENDER=0 DAOS_IMAGES_DIR=/tmp/daos-images-$CI_JOB_ID DOCKER="sudo podman" IMAGE_NSP="$REG/exastor/daos-images" IMAGE_TAG="$DAOS_IMAGE_TAG" hack/ci/render-validate.sh
  after_script:
    - rm -rf /tmp/daos-images-$CI_JOB_ID
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Helm chart: lint and render with every optional resource on.
helm:
  stage: check
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  script:
    - helm lint charts/daos-operator
    - helm template daos-operator charts/daos-operator --namespace daos-system --set system.create=true --set grafana.dashboard.enabled=true > /tmp/rendered.yaml
    - grep -c '^kind:' /tmp/rendered.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Container images. Runner "exa-build" is a shell executor with podman; the
# job token can push to the project registry.
.image-job: &image-job
  stage: image
  tags: [daos-build]
  needs:
    - job: go-build
      optional: true
  before_script:
    - podman --version
    # this GitLab reports the registry as host:80 while it actually serves TLS on 443: drop the port
    - export REG="${CI_REGISTRY%%:*}"
    - export IMG_BASE="$REG/$CI_PROJECT_PATH"
    # the registry rate-limits logins ("too many requests") when image jobs start together
    - |
      for i in 1 2 3 4 5; do
        echo "$CI_REGISTRY_PASSWORD" | podman login --username "$CI_REGISTRY_USER" --password-stdin "$REG" && break
        [ $i = 5 ] && exit 1; echo "login failed (attempt $i)"; sleep $((i * 15)); done
    - export VERSION=$(cat VERSION)
    # the registry's bearer token is short-lived and podman does not always refresh it on a
    # second push: log in again before every push, retry a few times
    - |
      push() { for i in 1 2 3; do
        echo "$CI_REGISTRY_PASSWORD" | podman login --username "$CI_REGISTRY_USER" --password-stdin "$REG" >/dev/null && podman push "$1" && return 0
        echo "push $1 failed (attempt $i)"; sleep 10; done; return 1; }
    # MR pipelines push only the commit tag the e2e jobs deploy; VERSION and latest move on main/tags
    - |
      publish() { push "$1:$CI_COMMIT_SHORT_SHA" || return 1
        [ -n "$CI_MERGE_REQUEST_IID" ] && return 0
        podman tag "$1:$CI_COMMIT_SHORT_SHA" "$1:$VERSION" "$1:latest" && push "$1:$VERSION" && push "$1:latest"; }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

image-operator:
  <<: *image-job
  script:
    - IMG="$IMG_BASE/daos-operator"
    - podman build --pull -t "$IMG:$CI_COMMIT_SHORT_SHA" .
    - publish "$IMG"

image-hostprep:
  <<: *image-job
  script:
    - IMG="$IMG_BASE/daos-hostprep"
    - podman build --pull -f images/hostprep/Dockerfile -t "$IMG:$CI_COMMIT_SHORT_SHA" .
    - publish "$IMG"

# e2e: ExaCI5 슬롯 3·4 VM 클러스터(doc/ci-design-2026-10-02.md). 러너 exaci5-3j, 태그 daos-k8s.
# 한 번에 한 파이프라인만 클러스터를 쓴다. Phase A 는 롤백만 검증한다(수동).
# LANE=a: slots 3·4 (4 workers). LANE=b: slot 5-2 (CP + 2 workers), Tier 1 only (design 8절). Each lane
# has its own cluster lock and kubeconfig file, so one job per lane can run at once on 3J (concurrent 2).
.daos-k8s: &daos-k8s
  stage: e2e
  tags: [daos-k8s]
  resource_group: daos-k8s-ci
  timeout: 45m
  variables:
    LANE: a
  before_script:
    - install -m 600 "$DAOS_CI_SSH_KEY" ~/.ssh/id_ed25519
    - if [ "$LANE" = b ]; then KCFG_SRC=$DAOS_CI_KUBECONFIG_B; else KCFG_SRC=$DAOS_CI_KUBECONFIG; fi
    - install -m 600 "$KCFG_SRC" ~/.kube/daos-ci-$LANE.conf
    - export KUBECONFIG=~/.kube/daos-ci-$LANE.conf
    - export VDI_SSH="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no -p 9349 jenkins-ci@192.168.2.186"
    # the operator and hostprep built from this commit (image-* jobs); the profiles pin a tag
    # only for local runs. Without this, MRs tested the pinned operator, not their own code.
    - export E2E_SET="image.tag=$CI_COMMIT_SHORT_SHA,hostprep.defaultImage=${CI_REGISTRY%%:*}/$CI_PROJECT_PATH/daos-hostprep:$CI_COMMIT_SHORT_SHA"
    # the profiles name lane A's server node; lane B's is another VM
    - if [ "$LANE" = b ]; then export E2E_SERVER_NODE=exaci5-2a E2E_SET="$E2E_SET,system.spec.nodeSelector.kubernetes\.io/hostname=exaci5-2a"; fi

# The Tier 1 suite, compiled where Go is and run on the CI cluster runner (no Go there).
e2e-build:
  stage: check
  image: golang:1.26
  variables:
    GOTOOLCHAIN: auto
    GOFLAGS: -buildvcs=false
  script:
    # static: the runner (3J) is Rocky 8 with glibc 2.28, the golang image is newer
    - CGO_ENABLED=0 go test -c -tags e2e -o dist/e2e.test ./test/e2e/
    - CGO_ENABLED=0 go build -o dist/kubectl-daos ./cmd/kubectl-daos
  artifacts:
    paths: [dist/e2e.test, dist/kubectl-daos]
    expire_in: 3 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Tier 1 (doc/ci-design-2026-10-02.md 7절). allow_failure while it settles (8절: 1~2 weeks), then blocking.
e2e-tier1:
  <<: *daos-k8s
  resource_group: daos-k8s-ci-b
  variables:
    LANE: b
  needs: [e2e-build, image-operator, image-hostprep]
  timeout: 75m
  script:
    - cd test/e2e && E2E_RESET=1 KUBECTL_DAOS=$CI_PROJECT_DIR/dist/kubectl-daos ../../dist/e2e.test -test.timeout 70m -ginkgo.v -ginkgo.label-filter='!upgrade && !regression && !tier2' -ginkgo.junit-report=$CI_PROJECT_DIR/dist/e2e-junit.xml
  artifacts:
    when: always
    reports:
      junit: dist/e2e-junit.xml
    expire_in: 14 days
  # a change that cannot affect a running system (docs only) does not take the cluster for 20 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &e2e-paths
        - api/**/*
        - cmd/**/*
        - internal/**/*
        - charts/**/*
        - config/**/*
        - images/**/*
        - test/e2e/**/*
        - hack/ci/**/*
        - Dockerfile
        - go.mod
        - go.sum
        - Makefile
        - .gitlab-ci.yml
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *e2e-paths
      allow_failure: true

# Tier 1 case 6: the previous release with data in use, upgraded to HEAD (kdev profile: the old
# release predates the NVMe binding fixes). Manual on MRs, nightly with Tier 2 (TIER=2 schedule): every
# main pipeline running it took the cluster ~25 more minutes per merge.
e2e-upgrade:
  <<: *daos-k8s
  needs: [e2e-build, image-operator, image-hostprep]
  timeout: 75m
  variables:
    LANE: a
    E2E_UPGRADE_FROM: v0.1.0-rc.4
  script:
    - git fetch -q --depth 1 origin tag "$E2E_UPGRADE_FROM"
    - cd test/e2e && E2E_RESET=1 E2E_PROFILE=kdev-1rank ../../dist/e2e.test -test.timeout 70m -ginkgo.v -ginkgo.label-filter=upgrade -ginkgo.junit-report=$CI_PROJECT_DIR/dist/e2e-upgrade-junit.xml
  artifacts:
    when: always
    reports:
      junit: dist/e2e-upgrade-junit.xml
    expire_in: 14 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TIER == "2"
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# Tier 1 cases 9-12: test-bed failures reproduced on purpose; each resets the cluster and installs
# its own broken system. Manual on MRs, nightly with Tier 2 (TIER=2 schedule), not on every main merge.
e2e-regression:
  <<: *daos-k8s
  needs: [e2e-build, image-operator, image-hostprep]
  timeout: 75m
  script:
    - cd test/e2e && E2E_NO_INSTALL=1 E2E_PROFILE=kdev-1rank ../../dist/e2e.test -test.timeout 70m -ginkgo.v -ginkgo.label-filter=regression -ginkgo.junit-report=$CI_PROJECT_DIR/dist/e2e-regression-junit.xml
  artifacts:
    when: always
    reports:
      junit: dist/e2e-regression-junit.xml
    expire_in: 14 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TIER == "2"
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# Tier 2 (doc/ci-design-2026-10-02.md 7절): nightly schedule with TIER=2. Reports only (8절), never
# blocks a merge. Each profile repeats Tier 1 cases 1-3 and 7; kdev-3rank also runs the resilience cases.
.e2e-tier2: &e2e-tier2
  <<: *daos-k8s
  needs: [e2e-build, image-operator, image-hostprep]
  timeout: 4h
  allow_failure: true
  artifacts:
    when: always
    paths: [dist/tier2-*.csv]
    reports:
      junit: dist/e2e-tier2-*.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TIER == "2"

e2e-tier2-kdev:
  <<: *e2e-tier2
  script:
    - cd test/e2e
    - E2E_RESET=1 E2E_PROFILE=kdev-3rank E2E_RANKS=3 KUBECTL_DAOS=$CI_PROJECT_DIR/dist/kubectl-daos ../../dist/e2e.test -test.timeout 80m -ginkgo.v -ginkgo.focus='case [1237]\)' -ginkgo.label-filter='!upgrade && !regression && !tier2' -ginkgo.junit-report=$CI_PROJECT_DIR/dist/e2e-tier2-kdev-t1.xml
    - E2E_RESET=1 E2E_PROFILE=kdev-3rank E2E_RANKS=3 E2E_TIMINGS=$CI_PROJECT_DIR/dist/tier2-kdev.csv KUBECTL_DAOS=$CI_PROJECT_DIR/dist/kubectl-daos ../../dist/e2e.test -test.timeout 150m -ginkgo.v -ginkgo.label-filter='tier2 && resilience' -ginkgo.junit-report=$CI_PROJECT_DIR/dist/e2e-tier2-kdev-res.xml

e2e-tier2-mixed:
  <<: *e2e-tier2
  script:
    - cd test/e2e
    - E2E_RESET=1 E2E_PROFILE=mixed-2engine E2E_RANKS=6 KUBECTL_DAOS=$CI_PROJECT_DIR/dist/kubectl-daos ../../dist/e2e.test -test.timeout 80m -ginkgo.v -ginkgo.focus='case [1237]\)' -ginkgo.label-filter='!upgrade && !regression && !tier2' -ginkgo.junit-report=$CI_PROJECT_DIR/dist/e2e-tier2-mixed-t1.xml
    - E2E_RESET=1 E2E_PROFILE=mixed-2engine E2E_RANKS=6 ../../dist/e2e.test -test.timeout 40m -ginkgo.v -ginkgo.label-filter='tier2 && mixed' -ginkgo.junit-report=$CI_PROJECT_DIR/dist/e2e-tier2-mixed-xfail.xml

e2e-tier2-tiers:
  <<: *e2e-tier2
  script:
    - cd test/e2e
    - E2E_RESET=1 E2E_PROFILE=tiers E2E_RANKS=3 KUBECTL_DAOS=$CI_PROJECT_DIR/dist/kubectl-daos ../../dist/e2e.test -test.timeout 80m -ginkgo.v -ginkgo.focus='case [1237]\)' -ginkgo.label-filter='!upgrade && !regression && !tier2' -ginkgo.junit-report=$CI_PROJECT_DIR/dist/e2e-tier2-tiers-t1.xml

env-reset:
  <<: *daos-k8s
  script:
    - hack/ci/rollback.sh
    - kubectl get nodes -o wide
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# kubectl-daos binaries for krew platforms, published as a generic package and
# linked from a GitLab Release. Tags only.
release-cli:
  stage: release
  image: golang:1.26
  variables:
    GOTOOLCHAIN: auto
    GOFLAGS: -buildvcs=false
  script:
    - VERSION="$CI_COMMIT_TAG" hack/release-cli.sh
    - |
      base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/kubectl-daos/$CI_COMMIT_TAG"
      for f in dist/*.tar.gz dist/SHA256SUMS; do
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$base/$(basename "$f")" >/dev/null
        echo "uploaded $(basename "$f")"
      done
      links=""
      for f in dist/*.tar.gz; do
        n=$(basename "$f")
        links="$links{\"name\":\"$n\",\"url\":\"$base/$n\",\"link_type\":\"package\"},"
      done
      links="${links%,}"
      printf '{"name":"kubectl-daos %s","tag_name":"%s","description":"kubectl-daos %s\\n\\nkrew platforms: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64. Checksums in SHA256SUMS.","assets":{"links":[%s]}}' \
        "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$links" > /tmp/release.json
      curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
        --data @/tmp/release.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" >/dev/null || \
        echo "release already exists or could not be created; package upload is done"
  artifacts:
    paths: [dist/]
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
