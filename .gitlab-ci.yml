#
# Phase 0 pipeline: only what runs without a DAOS cluster or a Kubernetes
# cluster. Do not add a job that silently skips when those are missing.
stages: [check]

default:
  image: python:3.12-slim
  tags: [Flexa]
  interruptible: true

variables:
  GIT_DEPTH: "20"

syntax:
  stage: check
  script:
    - find . -path ./.git -prune -o -name '*.sh' -print | xargs -r -n1 bash -n
    - find . -path ./.git -prune -o -name '*.py' -print | xargs -r -n50 python3 -m py_compile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

license-headers:
  stage: check
  script:
    - test -f LICENSE && test -f NOTICE
    - |
      sources=$(find . -path ./.git -prune -o -path ./third_party -prune -o \
        \( -name '*.py' -o -name '*.sh' -o -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.go' -o -name 'Dockerfile*' \) -print)
      missing=$(for f in $sources; do
          head -5 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0' || echo "$f";
        done)
      if [ -n "$missing" ]; then echo "SPDX header missing in:"; echo "$missing"; exit 1; fi
      echo "SPDX headers present in all $(echo "$sources" | wc -w) sources"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Go: build + vet + unit tests without envtest binaries (controller tests that
# need envtest run in Phase 2 on a runner with setup-envtest).
go-build:
  stage: check
  image: golang:1.26
  variables:
    GOTOOLCHAIN: auto   # go.mod pins go 1.26.0; let go fetch the exact toolchain if the image lags
    GOFLAGS: -buildvcs=false
  script:
    - go build ./...
    - go vet ./...
    - gofmt -l api/ internal/ cmd/ | tee /tmp/gofmt.txt; test ! -s /tmp/gofmt.txt
    - make manifests generate && git diff --exit-code -- config/crd api/
    - make helm-sync && git diff --exit-code -- charts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Helm chart: lint and render with every optional resource on.
helm:
  stage: check
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  script:
    - helm lint charts/daos-operator
    - helm template daos-operator charts/daos-operator --namespace daos-system --set system.create=true --set grafana.dashboard.enabled=true > /tmp/rendered.yaml
    - grep -c '^kind:' /tmp/rendered.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
