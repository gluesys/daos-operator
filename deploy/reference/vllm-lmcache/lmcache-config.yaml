#
# LMCache configuration for the DAOS remote backend (lmcache-daos, in-process
# connector). Mounted into the vLLM pod and selected with LMCACHE_CONFIG_FILE.
# One URL names the pool and container; the container is the DaosContainer
# `kvlmc` (POSIX, chunk 4 MiB) the operator created in podpool. Plugin route
# only: with remote_url as well LMCache 0.5.5 builds two RemoteBackends on the
# same container and stores every chunk twice. The target is read from
# extra_config, which needs lmcache-daos MR !50 or later in the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmcache-daos-config
  namespace: daos-system
data:
  lmcache_daos.yaml: |
    chunk_size: 256
    remote_serde: "naive"
    remote_storage_plugins: ["daos"]
    extra_config:
      remote_storage_plugin.daos.url: "plugin://daos/podpool/kvlmc?sys=daos_k8s"
      remote_storage_plugin.daos.module_path: lmcache_daos.connector
      remote_storage_plugin.daos.class_name: DaosConnector
