#
# vLLM + LMCache with a DAOS container as the KV-cache backend (daos-operator #25).
#
# hostNetwork 인 이유: daos_agent 는 자기가 보는 인터페이스 이름을 클라이언트에 건네고,
# 클라이언트는 자기가 알린 주소로 서버가 닿을 수 있어야 한다. 파드 네트워크에서는
# flannel 이 노드 IP 로 마스커레이드(`-s 10.244.0.0/16 -j MASQUERADE`)하므로 알린 주소와
# 실제 출발지가 어긋나 클라이언트가 DER_TIMEDOUT 으로 끝난다(cxl2 실측). CSI 노드
# 플러그인과 S3 게이트웨이가 hostNetwork 인 것도 같은 이유다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-daos
  namespace: daos-system
  labels: {app: vllm-daos}
spec:
  replicas: 1
  strategy: {type: Recreate}      # GPU 가 하나다
  selector: {matchLabels: {app: vllm-daos}}
  template:
    metadata:
      labels: {app: vllm-daos}
    spec:
      runtimeClassName: nvidia    # CRI-O 는 CDI 애너테이션을 무시한다(README 참조)
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {daos.gluesys.com/gpu: "true"}
      imagePullSecrets: [{name: gitlab-registry}]
      containers:
        - name: vllm
          image: registry.gitlab.gluesys.com/exastor/daos-images/vllm-lmcache-daos:0.30.0-0.5.5-20260927
          command: ["python3.12", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - --model=/data/hf_cache/hub/models--meta-llama--Llama-3.1-8B-Instruct/snapshots/0e9e39f249a16976918f6564b8830bc894c89659
            - --served-model-name=llama31-8b-daos
            - --host=0.0.0.0
            - --port=8100          # 8000 은 이 노드의 다른 서비스가 쓴다
            - --dtype=bfloat16
            - --max-model-len=16384
            - --gpu-memory-utilization=0.40   # 같은 GPU 를 쓰는 데모(약 22 GB)와 공존
            - --kv-transfer-config={"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}
          env:
            - {name: LMCACHE_CONFIG_FILE, value: /etc/lmcache/lmcache_daos.yaml}
            - {name: DAOS_AGENT_DRPC_DIR, value: /var/run/daos_agent}
            - {name: PYTHONHASHSEED, value: "0"}    # lmcache-daos: 프로세스 간 해시 고정
            - {name: HF_HOME, value: /data/hf_cache}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: VLLM_LOGGING_LEVEL, value: INFO}
            # 이미지에 CUDA 툴체인(nvcc)이 없다. flashinfer 샘플러는 커널을 JIT
            # 컴파일하려다 엔진 기동을 통째로 실패시킨다(cxl2 실측).
            - {name: VLLM_USE_FLASHINFER_SAMPLER, value: "0"}
          ports: [{name: http, containerPort: 8100}]
          resources:
            limits: {nvidia.com/gpu: 1}
            requests: {cpu: "8", memory: 32Gi}
          volumeMounts:
            - {name: agent-sock, mountPath: /var/run/daos_agent}
            - {name: lmcache-config, mountPath: /etc/lmcache, readOnly: true}
            - {name: hf-cache, mountPath: /data/hf_cache}
            - {name: shm, mountPath: /dev/shm}
          readinessProbe:
            httpGet: {path: /health, port: 8100}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 60
      volumes:
        - name: agent-sock
          hostPath: {path: /var/run/daos_agent/daos-k8s, type: Directory}   # spec.clientAgent 가 만든다
        - name: lmcache-config
          configMap: {name: lmcache-daos-config}
        - name: hf-cache
          hostPath: {path: /mnt/nvme1/hf_cache, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-daos
  namespace: daos-system
spec:
  selector: {app: vllm-daos}
  ports: [{name: http, port: 8100, targetPort: 8100}]
