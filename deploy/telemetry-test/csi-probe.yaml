apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gpuflow-telemetry-test
provisioner: daos.csi.gluesys.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  pool: telemetry-lab-pool
  oclass: SX
  dirOclass: S1
  rdFac: '0'
  chunkSize: '4194304'
  csum: crc32
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telemetry-csi-probe
  namespace: daos-system
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: gpuflow-telemetry-test
  resources:
    requests:
      storage: 64Mi
